<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;width:300px;margin:0;padding:14px;color:#1f2a37;font-size:13px}
  h1{font-size:14px;margin:0 0 2px} .sub{color:#8b9aa9;font-size:11px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid #eef1f4}
  .big{font-size:26px;font-weight:700;letter-spacing:-1px}
  .sw{position:relative;width:44px;height:24px}
  .sw input{opacity:0;width:0;height:0}
  .sl{position:absolute;inset:0;background:#c3cdd6;border-radius:12px;transition:.2s;cursor:pointer}
  .sl:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  input:checked+.sl{background:#02984e} input:checked+.sl:before{transform:translateX(20px)}
  .hosts{font-size:12px;color:#5a6b7c} .hosts div{display:flex;justify-content:space-between;padding:2px 0}
  button{width:100%;margin-top:8px;height:34px;border:1px solid #dde3e9;border-radius:4px;background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}
  button.p{background:#02984e;border-color:#02984e;color:#fff;font-weight:600}
  .tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#eaf7f0;color:#016b38;font-weight:600}
  .tag.off{background:#f6f8fa;color:#8b9aa9}
</style>
</head>
<body>
  <h1>QUOTO · Connettore Mappatura</h1>
  <div class="sub">Registra la struttura delle API dei portali. Nessun dato personale.</div>

  <div class="row">
    <div><div class="big" id="count">0</div><div style="font-size:11px;color:#8b9aa9">endpoint mappati</div></div>
    <div style="text-align:right">
      <div id="stateTag" class="tag">ATTIVO</div><br>
      <label class="sw" style="margin-top:8px;display:inline-block"><input type="checkbox" id="toggle"><span class="sl"></span></label>
    </div>
  </div>

  <div class="row hosts" id="hosts"></div>

  <button class="p" id="dl">Scarica mappa (JSON)</button>
  <button id="send">Invia ora al server</button>
  <button id="reset">Azzera</button>

  <script src="popup.js"></script>
</body>
</html>
