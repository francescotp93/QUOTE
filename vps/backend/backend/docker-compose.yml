version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: quote_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       quotedb
      POSTGRES_USER:     quote_user
      POSTGRES_PASSWORD: quote_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quote_user -d quotedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quote_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
