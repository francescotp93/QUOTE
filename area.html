<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Area riservata convenzionati — With Us Assicurazioni</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{ --blue:#3b5bfd; --blue2:#2a45e0; --ink:#141a2e; --muted:#6b7488; --line:#e6e9f2; --verde:#0a7a55; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f6fc;min-height:100vh}
  .top{background:linear-gradient(135deg,#0b1437,#1b2a6b);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top img{height:30px;width:auto;display:block}
  .top .chi{font-size:13px;opacity:.9;display:flex;align-items:center;gap:12px}
  .esci{background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px}
  .wrap{max-width:760px;margin:0 auto;padding:20px 14px 48px}
  .card{background:#fff;border-radius:18px;box-shadow:0 2px 14px rgba(20,26,46,.07);padding:22px 24px;margin-bottom:16px}
  .card.stretta{max-width:430px;margin:40px auto}
  h1{font-size:21px;margin:0 0 6px}
  h2{font-size:17px;margin:0 0 12px}
  .muted{color:var(--muted);font-size:13.5px;line-height:1.6}
  .f{margin-bottom:13px}
  .f label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .f input,.f textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit}
  .due{display:flex;gap:10px;flex-wrap:wrap} .due .f{flex:1;min-width:150px}
  .btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:800;font-size:15.5px;cursor:pointer;font-family:inherit;margin-top:4px}
  .btn.chiaro{background:#eef2ff;color:var(--blue)}
  .btn:disabled{opacity:.55;cursor:default}
  .link{background:none;border:none;color:var(--blue);font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;text-decoration:underline;padding:8px 0}
  .msg{border-radius:11px;padding:11px 13px;font-size:13.5px;margin:10px 0;display:none;line-height:1.5}
  .msg.err{background:#fdecec;color:#c0392b;display:block}
  .msg.ok{background:#e8f7ee;color:#1e7d46;display:block}
  .cz{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#3a4254;margin:12px 0;cursor:pointer;line-height:1.55}
  .cz input{margin-top:2px;width:18px;height:18px;flex:0 0 auto}
  .otp{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:12px;font-size:24px;letter-spacing:8px;text-align:center;font-weight:800;font-family:inherit}
  .prod{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #f1f3f9;flex-wrap:wrap}
  .prod:last-child{border-bottom:none}
  .prod .ic{flex:0 0 auto}
  .prod .nm{font-weight:800;font-size:15px}
  .prod .ds{font-size:13px;color:var(--muted);margin-top:1px}
  .prod .az{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scegli{background:var(--verde);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;font-family:inherit;font-size:14px;white-space:nowrap}
  .scegli.chiedi{background:#fff;color:var(--blue);border:1.5px solid #c9d6ff}
  .nota{font-size:12.5px;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .nota.manca{color:#8a5300;text-decoration:none}
  .pass-hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
  /* ── LE LINGUETTE ──────────────────────────────────────────────────────────
     Una riga sola, che va a capo sul telefono invece di scorrere di lato: una
     linguetta che sta fuori dallo schermo e' una sezione che non esiste. */
  .linguette{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 18px;border-bottom:1px solid var(--line);padding-bottom:12px}
  .lin{display:inline-flex;align-items:center;gap:6px;background:#f4f6fc;color:var(--muted);border:1px solid transparent;border-radius:22px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .lin:hover{background:#eceffa;color:var(--ink)}
  .lin.viva{background:#eef2ff;color:var(--blue);border-color:#c9d6ff}
  .lin i{font-size:15px}
  /* IL TRIANGOLO. Non e' rosso: rosso vuol dire «e' andato storto qualcosa»,
     e qui non e' andato storto niente — manca solo qualcosa da scrivere. */
  .avviso{color:#e0932f;font-size:14px;vertical-align:-1px}
  .allarme{display:flex;gap:11px;align-items:flex-start;background:#fff8ec;border:1px solid #f6dfb8;border-radius:12px;padding:12px 14px;margin-top:14px;line-height:1.5}
  .allarme > i{color:#e0932f;font-size:20px;line-height:1.2;flex:0 0 auto}
  .griglia{display:flex;flex-wrap:wrap;gap:0 12px}
  .griglia .f{flex:1 1 190px;min-width:150px}
  .griglia input.manca{border-color:#f0cf9a;background:#fffdf8}
  /* ── I SUGGERIMENTI DEL COMUNE ─────────────────────────────────────────────
     Sopra tutto il resto e attaccato alla casella: un elenco che si apre sotto
     e spinge giu' i campi fa perdere il posto a chi sta compilando.
     Un tetto d'altezza con lo scorrimento, perche' otto voci su un telefono
     coprirebbero mezzo modulo. */
  .sugg{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 8px 24px rgba(20,26,46,.13);overflow:auto;max-height:230px;margin-top:3px}
  .sugg.aperto{display:block}
  .sugg .sv{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid #f3f5fb;padding:10px 12px;font-size:14px;font-family:inherit;cursor:pointer;color:var(--ink)}
  .sugg .sv:last-child{border-bottom:none}
  .sugg .sv:hover,.sugg .sv:focus{background:#eef2ff}
  .sugg .sv span{color:var(--muted);font-size:12.5px}
  .capnota{font-size:12px;color:#8a5300;margin-top:4px;line-height:1.4}
  .capnota:empty{display:none}
  /* ── IL FILO DELLA CONVERSAZIONE ───────────────────────────────────────────
     I suoi messaggi a destra, i nostri a sinistra: e' la forma che tutti sanno
     gia' leggere, e toglie di mezzo la domanda «questo chi l'ha scritto?». */
  .filo{margin-top:16px;display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding-right:4px}
  .bolla{max-width:82%;border-radius:14px;padding:10px 13px;line-height:1.55}
  .bolla.nostro{align-self:flex-start;background:#f2f5fd;border:1px solid #e3e9f8;border-bottom-left-radius:5px}
  .bolla.mio{align-self:flex-end;background:#e8f6ef;border:1px solid #cdeade;border-bottom-right-radius:5px}
  .bolla .chi{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
  .bolla .tx{font-size:14px;white-space:pre-wrap}
  .bolla .allegato{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13.5px;font-family:inherit;cursor:pointer;color:var(--blue);font-weight:700;display:inline-flex;align-items:center;gap:6px;max-width:100%}
  .bolla .allegato span{color:var(--muted);font-weight:400;font-size:12px}
  /* ── I POST SCORREVOLI ─────────────────────────────────────────────────────
     Scorrono col dito e si agganciano: mezza scheda a schermo non si legge, e
     una fila che si ferma dove capita sembra rotta. La barra si vede, perche'
     una fila che scorre senza dirlo non la prova nessuno. */
  .posts{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .posts .post{flex:0 0 260px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column}
  a.post:hover{border-color:#c9d6ff;box-shadow:0 3px 12px rgba(20,26,46,.09)}
  .posts .post img{width:100%;height:150px;object-fit:cover;display:block;background:#eef2ff}
  .posts .p-vuota{height:150px;display:flex;align-items:center;justify-content:center;background:#eef2ff;color:var(--blue);font-size:40px}
  .posts .p-testo{padding:11px 13px 13px}
  .posts .ti{font-weight:800;font-size:14.5px;line-height:1.3}
  .posts .tx{font-size:13px;color:var(--muted);line-height:1.5;margin-top:3px}
  .posts .fino{font-size:11.5px;color:var(--muted);margin-top:6px}
  /* ── LE ICONE DEI PRODOTTI ─────────────────────────────────────────────────
     Icone del kit, non emoji di sistema: le emoji le disegna il telefono, e la
     stessa faccina e' diversa su Android, su iPhone e su Windows — in mezzo a
     un'interfaccia disegnata a linee stonano e basta. */
  .prod .ic{color:var(--blue);background:#eef2ff;border-radius:12px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:23px}
  /* L'OCCHIO SULLA PASSWORD. Qui serve piu' che altrove: la password
     provvisoria arriva per email e si ribatte a mano, spesso dal telefono.
     Un carattere sbagliato diventa «email o password non corretti», che manda
     a dubitare dell'indirizzo invece che di una lettera.
     Si rinasconde da sola dopo dodici secondi: una password lasciata a schermo
     e' peggio del problema che risolve. */
  .pw-box{position:relative}
  .pw-box input{padding-right:46px}
  .pw-occhio{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:flex;align-items:center;border-radius:8px}
  .pw-occhio:hover{color:var(--ink);background:rgba(0,0,0,.05)}
  .pw-occhio.aperto{color:var(--verde)}
  /* IL BANNER SCORRE, MA NON SCAPPA. Si ferma quando ci passi sopra col dito o
     col mouse: un annuncio che si sposta mentre lo stai leggendo e' peggio di
     nessun annuncio. E se chi guarda ha chiesto al sistema meno animazioni
     (prefers-reduced-motion), sta fermo del tutto — per qualcuno il movimento
     non e' una preferenza, e' un malessere. */
  .banner{background:linear-gradient(135deg,#0b1437,#2a45e0);color:#fff;border-radius:16px;padding:0;margin-bottom:16px;overflow:hidden;position:relative}
  .banner .pista{display:flex;gap:36px;padding:15px 20px;white-space:nowrap;animation:scorri 26s linear infinite}
  .banner:hover .pista,.banner:focus-within .pista{animation-play-state:paused}
  .banner .voce{display:inline-flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700}
  .banner .voce .em{font-size:19px}
  .banner .voce small{font-weight:400;opacity:.85;margin-left:4px}
  @keyframes scorri{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){
    .banner .pista{animation:none;white-space:normal;flex-wrap:wrap;gap:14px}
  }
  .off{display:flex;gap:13px;align-items:flex-start;background:#f7f9ff;border:1px solid #e4eaff;border-radius:13px;padding:13px 15px;margin-bottom:10px}
  .off .em{font-size:26px;line-height:1;flex:0 0 auto}
  .off .ti{font-weight:800;font-size:14.5px}
  .off .tx{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.55}
  .off .fino{font-size:12px;color:#8a5300;margin-top:4px}
  /* PARLARE CON UNA PERSONA. In fondo, sempre allo stesso posto: chi ha un
     dubbio su una polizza non deve cercare come si fa a chiedere. */
  .aiuto{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .aiuto a{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:12px;padding:13px 14px;font-weight:800;font-size:14px;border:1.5px solid var(--line);color:var(--ink);background:#fff}
  .aiuto a i{font-size:19px}
  .aiuto a.wa{background:#25d366;border-color:#25d366;color:#fff}
  .aiuto a.ml{background:#eef2ff;border-color:#dbe3ff;color:var(--blue2)}
</style>
</head>
<body>
<div class="top">
  <img src="withus-logo-white.png" alt="With Us Assicurazioni"
       onerror="this.outerHTML='<b style=\'letter-spacing:2px;font-size:13px\'>WITH US ASSICURAZIONI</b>'">
  <div class="chi" id="chi" style="display:none"><span id="chi-nome"></span><button class="esci" onclick="esci()">Esci</button></div>
</div>
<div class="wrap" id="wrap"><div class="card stretta" id="bd"><div class="muted" style="text-align:center">Caricamento…</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ══ AREA RISERVATA CONVENZIONATI ═════════════════════════════════════════════
   Chi entra qui non fa parte dell'agenzia: e' un associato di una convenzione,
   approvato da noi, che ha ricevuto le credenziali per email.

   QUATTRO PORTE IN FILA, e nessuna si puo' saltare:
     1. entra con email e password;
     2. se la password e' ancora quella provvisoria, ne sceglie una sua;
     3. conferma i propri dati e i consensi, con un codice mandato alla sua
        email — cosi', anche fra due anni, si puo' dire che quel consenso l'ha
        dato QUELLA persona e non qualcuno seduto al suo computer;
     4. da li' vede i prodotti della SUA convenzione, e solo quelli.

   PERCHE' I CONTROLLI VERI NON STANNO QUI DENTRO
   Questa pagina gira nel browser di chi la apre: tutto quello che decide si
   puo' aggirare chiudendola e parlando col database a mano. Quindi qui c'e'
   solo la buona educazione — cosa mostrare, in che ordine, con quali parole —
   mentre chi ha diritto a leggere che cosa lo decidono le protezioni del
   database (un associato vede SOLO la propria riga e i prodotti della propria
   convenzione) e il nostro server, che e' l'unico a poter cambiare una
   password o a registrare un consenso. */
const SUPABASE_URL = 'https://ekjxrnsfqxnfxzrthdcf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVranhybnNmcXhuZnh6cnRoZGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzU4NjcsImV4cCI6MjA5NTAxMTg2N30.2OF2COAcLgM22xbmtqLWXgaDcVLtNh3AuX5MQ4_L02I';
const API = 'https://api.withusassicurazioni.it';
const VERSIONE_PRIVACY = 'v1-2026-09';

/* ── COME CI SI PARLA ─────────────────────────────────────────────────────────
   I recapiti dell'agenzia, in un posto solo. Il numero di WhatsApp va scritto
   in formato internazionale SENZA il piu' e senza spazi (es. 393401234567):
   e' come lo vuole wa.me, e sbagliarlo porta a una pagina di errore invece che
   alla chat.
   UN RECAPITO VUOTO NON DIVENTA UN PULSANTE ROTTO: se manca, quel pulsante non
   compare. Meglio due strade che funzionano che tre di cui una porta a vuoto. */
const CONTATTI = {
  // Le stesse forme gia' usate nel piede delle email e nell'informativa privacy:
  // un recapito scritto in due modi diversi, prima o poi, e' un recapito
  // sbagliato in uno dei due posti.
  whatsapp: '393791761426',                       // wa.me lo vuole cosi': niente + e niente spazi
  telefono: '0923 1963896',
  email: 'amministrazione@withusassicurazioni.it',
};
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
let IO = null;      // la riga dell'associato
let PRODOTTI = [];
let DOMANDE = [];   // le domande del prodotto che si sta compilando

const schermo = h => { $('bd').innerHTML = h; };
const OCCHIO = '<button type="button" class="pw-occhio" aria-label="Mostra la password" title="Mostra la password" onclick="mostraPw(this)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>';
function mostraPw(btn){
  const el = btn.parentElement.querySelector('input'); if(!el) return;
  const aperto = el.type === 'text';
  el.type = aperto ? 'password' : 'text';
  btn.classList.toggle('aperto', !aperto);
  btn.setAttribute('aria-label', aperto ? 'Mostra la password' : 'Nascondi la password');
  btn.title = btn.getAttribute('aria-label');
  clearTimeout(el.__t);
  if(!aperto) el.__t = setTimeout(() => {
    el.type = 'password'; btn.classList.remove('aperto');
    btn.setAttribute('aria-label', 'Mostra la password'); btn.title = 'Mostra la password';
  }, 12000);
}

function avviso(t, tipo){ const m = $('msg'); if(!m) return; m.className = 'msg ' + (tipo || 'err'); m.innerHTML = t; }
const attesa = (b, t) => { if(b){ b.disabled = true; b.dataset.old = b.dataset.old || b.textContent; b.textContent = t; } };
const libero = (b) => { if(b){ b.disabled = false; if(b.dataset.old) b.textContent = b.dataset.old; } };

async function conToken(via, corpo){
  const { data } = await db.auth.getSession();
  const tok = data && data.session && data.session.access_token;
  const r = await fetch(API + '/convenzionati/' + via, {
    method: 'POST',
    headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + (tok || '') },
    body: JSON.stringify(corpo || {}),
  });
  const d = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(d.error || ('Errore ' + r.status));
  return d;
}

// ── 1. ENTRA ──────────────────────────────────────────────────────────────────
function schermoAccesso(messaggio){
  document.querySelector('.card').className = 'card stretta';
  $('chi').style.display = 'none';
  schermo(
     '<h1>Area riservata</h1>'
    +'<div class="muted" style="margin-bottom:16px">Entra con l\'email e la password che ti abbiamo mandato.</div>'
    +(messaggio ? '<div class="msg ok">' + messaggio + '</div>' : '')
    +'<div class="f"><label>EMAIL</label><input id="email" type="email" autocomplete="username" inputmode="email"></div>'
    +'<div class="f"><label>PASSWORD</label><div class="pw-box"><input id="pw" type="password" autocomplete="current-password">' + OCCHIO + '</div></div>'
    +'<div class="msg" id="msg"></div>'
    +'<button class="btn" id="b" onclick="entra()">Entra</button>'
    +'<div style="text-align:center"><button class="link" onclick="scordata()">Ho dimenticato la password</button></div>');
  const e = $('email'); if(e) e.focus();
  for(const id of ['email','pw']){ const el = $(id); if(el) el.addEventListener('keydown', ev => { if(ev.key === 'Enter') entra(); }); }
}

async function entra(){
  const email = ($('email').value || '').trim().toLowerCase();
  const pw = $('pw').value || '';
  if(!email || !pw) return avviso('Servono email e password.');
  attesa($('b'), 'Entro…');
  const { error } = await db.auth.signInWithPassword({ email, password: pw });
  if(error){
    libero($('b'));
    /* «Invalid login credentials» non dice niente a chi legge. E non si dice
       QUALE dei due e' sbagliato: sarebbe un modo per scoprire quali indirizzi
       esistono. */
    return avviso(/invalid|credentials/i.test(error.message)
      ? 'Email o password non corretti. Se hai copiato la password dall\'email, controlla di non aver preso spazi in più.'
      : error.message);
  }
  dove();
}

async function scordata(){
  const email = (($('email') || {}).value || '').trim().toLowerCase();
  if(!email) return avviso('Scrivi prima la tua email qui sopra, poi premi di nuovo.');
  const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: location.href });
  /* Si risponde la stessa cosa sia che l'indirizzo esista sia che non esista:
     altrimenti questa pagina diventerebbe un modo per sapere chi e' associato. */
  avviso(error && !/user|not found/i.test(error.message)
    ? error.message
    : 'Se quell\'indirizzo è registrato, fra poco ricevi l\'email per rifare la password.', 'ok');
}

async function esci(){ await db.auth.signOut(); IO = null; schermoAccesso(); }

// ── Dove mandare chi e' entrato ───────────────────────────────────────────────
async function dove(){
  const { data: ses } = await db.auth.getSession();
  if(!ses || !ses.session) return schermoAccesso();
  const { data, error } = await db.from('quote_convenzione_associati')
    .select('*, quote_convenzioni(nome, ente)').limit(1);
  if(error || !data || !data.length){
    /* Un accesso che non e' legato a nessun associato: puo' essere uno di noi
       che ha sbagliato porta. Si dice, e si esce. */
    await db.auth.signOut();
    return schermoAccesso('Questo accesso non è abilitato all\'area convenzionati.');
  }
  IO = data[0];
  $('chi-nome').textContent = (IO.nome || '') + ' ' + (IO.cognome || '');
  $('chi').style.display = 'flex';
  if(IO.deve_cambiare_password) return schermoPassword();
  if(!IO.privacy_accettata_il) return schermoDati();
  return schermoArea();
}

// ── 2. LA PASSWORD TUA ────────────────────────────────────────────────────────
function schermoPassword(){
  document.querySelector('.card').className = 'card stretta';
  schermo(
     '<h1>Scegli la tua password</h1>'
    +'<div class="muted" style="margin-bottom:16px">Quella che ti abbiamo mandato serviva solo per entrare la prima volta.</div>'

async function salvaPassword(){
  const p1 = $('p1').value || '', p2 = $('p2').value || '';
  if(p1 !== p2) return avviso('Le due password non coincidono.');
  attesa($('b'), 'Salvo…');
  try{

       nel browser sarebbe un suggerimento che basta chiudere la pagina per
       saltare. */
    await conToken('mia-password', { password: p1 });

/* CINQUE SEZIONI, UNA PER VOLTA.
   Prima era tutto uno sotto l'altro: prodotti, polizze, richieste, offerte,
   contatti. Su un telefono voleva dire scorrere sei schermate per arrivare ai
   propri dati, e chi cercava una cosa passava davanti a quattro che non gli
   servivano. Adesso ognuna ha il suo posto e si sceglie da una riga sola.

   COSA STA SEMPRE A SCHERMO, in ogni sezione: il saluto con la convenzione, il
   banner delle offerte, e i contatti in fondo. Sono le tre cose che servono
   sempre — chi cerca aiuto non deve prima capire in che sezione si trova. */
const SEZIONI = [
  { k: 'prodotti',  et: 'Prodotti',    ic: 'ti-shield-check' },
  { k: 'polizze',   et: 'Le tue polizze', ic: 'ti-file-check' },
  { k: 'richieste', et: 'Le tue richieste', ic: 'ti-message-2' },
  { k: 'offerte',   et: 'Offerte',     ic: 'ti-gift' },
  { k: 'dati',      et: 'I tuoi dati', ic: 'ti-user' },
];
let SEZIONE = 'prodotti';
let MANCA = [];          // cosa manca all'anagrafica: alimenta il triangolo
let ANAG = null;

function disegnaLinguette(){
  const box = $('sezioni'); if(!box) return;
  box.innerHTML = SEZIONI.map(s =>
    '<button class="lin' + (SEZIONE === s.k ? ' viva' : '') + '" onclick="vaiA(\'' + s.k + '\')">'
    + '<i class="ti ' + s.ic + '"></i>' + esc(s.et)
    /* IL TRIANGOLO. Sta sulla linguetta e non solo dentro la sezione: se stesse
       solo dentro, per accorgersene bisognerebbe entrarci — cioe' sapere gia'
       che c'e' qualcosa da fare. */
    + (s.k === 'dati' && MANCA.length ? '<i class="ti ti-alert-triangle-filled avviso" title="Mancano dei dati"></i>' : '')
    + '</button>').join('');
}

function vaiA(k){
  SEZIONE = k;
  disegnaLinguette();
  for(const s of SEZIONI){
    const el = $('sez-' + s.k);
    if(el) el.style.display = (s.k === k) ? '' : 'none';
  }
  if(k === 'dati' && !ANAG) caricaMiaAnagrafica();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function schermoArea(){
  const conv = IO.quote_convenzioni || {};
  document.querySelector('.card').className = 'card';
  schermo(
     '<h1>Ciao ' + esc(IO.nome) + '</h1>'
    +'<div class="muted">Convenzione <b>' + esc(conv.nome || '') + '</b>' + (conv.ente ? ' · ' + esc(conv.ente) : '') + '</div>'
    +'<div id="banner"></div>'
    +'<div id="avviso-dati"></div>'
    +'<div class="linguette" id="sezioni"></div>'
    +'<div id="sez-prodotti"><h2>I prodotti riservati a te</h2><div id="lista" class="muted">Carico…</div></div>'
    +'<div id="sez-polizze" style="display:none"><h2>Le tue polizze</h2><div id="polizze" class="muted">Carico…</div></div>'
    +'<div id="sez-richieste" style="display:none"><h2>Le tue richieste</h2><div id="mie" class="muted">Carico…</div></div>'
    +'<div id="sez-offerte" style="display:none"><h2>Offerte per te</h2><div id="offerte" class="muted">Carico…</div></div>'
    +'<div id="sez-dati" style="display:none"><h2>I tuoi dati</h2><div id="dati" class="muted">Carico…</div></div>'
    +'<div id="aiuto"></div>');
  SEZIONE = 'prodotti'; ANAG = null; MANCA = [];
  battito();
  disegnaLinguette();
  caricaOfferte();
  caricaMiePolizze();
  caricaMieRichieste();
  /* L'anagrafica si chiede SUBITO anche se la sua sezione e' chiusa: serve a
     sapere se accendere il triangolo, e un avviso che compare solo dopo che ci
     sei entrato non avvisa nessuno. */
  caricaMiaAnagrafica();
  mostraContatti();
  try{
    /* Si chiedono al database senza dire quale convenzione: e' la protezione a
       decidere che si vedono solo i prodotti della PROPRIA. Se lo decidesse
       questa pagina, basterebbe cambiare un numero per vedere quelli di
       un'altra. */
    const { data, error } = await db.from('quote_convenzione_prodotti')
      .select('*').eq('attivo', true).order('ordine').order('nome');
    if(error) throw error;
    PRODOTTI = data || [];
    if(!PRODOTTI.length){
      $('lista').innerHTML = 'Non ci sono ancora prodotti in questa convenzione. Appena li aggiungiamo li trovi qui.';
      return;
    }
    $('lista').className = '';
    $('lista').innerHTML = PRODOTTI.map(rigaProdotto).join('');
  }catch(e){ $('lista').innerHTML = 'Non riesco a caricare i prodotti: ' + esc(e.message || ''); }
}

/* ── APRIRE UNA RICHIESTA E PARLARCI SOPRA ────────────────────────────────────
   Nell'elenco «Le tue richieste» si vedeva a che punto era e basta. Chi voleva
   dire una cosa, o mandare il libretto, doveva scriverci a parte — e quel
   messaggio finiva in una casella, lontano dalla pratica a cui si riferiva.

   Qui la conversazione sta ATTACCATA alla richiesta. Quello che vede e' solo
   quello che gli abbiamo mandato apposta: la differenza fra una nota fra noi e
   una risposta a lui la fa il server, non questa pagina. */
let RICH_APERTA = null;

async function apriMiaRichiesta(id){
  const el = $('rich-' + id); if(el) el.style.opacity = '.5';
  try{
    const d = await conToken('mia-richiesta', { id });
    RICH_APERTA = d;
    disegnaConversazione();
  }catch(e){
    if(el) el.style.opacity = '';
    avviso(esc(e.message || 'Non riesco ad aprire questa richiesta.'));
  }
}

function disegnaConversazione(){
  const d = RICH_APERTA; if(!d) return;
  const r = d.richiesta;
  const [et, sf, sc] = STATO_DETTO[r.stato] || ['—', '#f1f1f1', '#666'];
  const rif = r.numero != null ? 'CV-' + String(r.numero).padStart(4, '0') : '';
  /* Messaggi e allegati NELLA STESSA FILA, in ordine di tempo: sono due modi di
     dire la stessa cosa, e separarli obbligherebbe a leggere due elenchi e a
     rimetterli in ordine a mente. */
  const righe = [
    ...d.messaggi.map(m => ({ q: m.creato_il, tipo: 'msg', x: m })),
    ...d.allegati.map(a => ({ q: a.creato_il, tipo: 'all', x: a })),
  ].sort((a, b) => new Date(a.q) - new Date(b.q));

  document.querySelector('.card').className = 'card';
  schermo(
     '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    +'<h1 style="margin:0">' + esc(r.prodotto_nome) + '</h1>'
    + (rif ? '<span class="muted" style="font-family:ui-monospace,monospace;font-size:12.5px">' + esc(rif) + '</span>' : '')
    +'<span style="background:' + sf + ';color:' + sc + ';border-radius:20px;padding:3px 11px;font-size:12px;font-weight:800">' + esc(et) + '</span>'
    +'</div>'
    +'<div class="muted" style="margin-top:3px">Richiesta del ' + esc(new Date(r.creato_il).toLocaleDateString('it-IT')) + '</div>'
    +'<div id="msg" class="msg"></div>'
    +'<div class="filo">' + (righe.length ? righe.map(rigaFilo).join('')
        : '<div class="muted">Non c\'è ancora niente. Se ti serve dirci qualcosa, scrivilo qui sotto.</div>') + '</div>'
    +'<div style="margin-top:16px">'
    +'<textarea id="c-testo" rows="3" placeholder="Scrivi qui…" style="width:100%;box-sizing:border-box;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;resize:vertical"></textarea>'
    +'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:9px;align-items:center">'
    +'<button class="scegli" onclick="mandaMessaggio(this)">Manda</button>'
    +'<label class="scegli chiedi" style="cursor:pointer"><i class="ti ti-paperclip"></i> Allega un file'
    +'<input type="file" id="c-file" style="display:none" onchange="mandaAllegato(this)"></label>'
    +'<button class="scegli chiedi" style="margin-left:auto" onclick="schermoArea()">Torna indietro</button>'
    +'</div>'
    +'<div class="muted" style="font-size:12.5px;margin-top:8px">Al massimo 10 MB per file. Quello che scrivi qui arriva a chi sta seguendo la tua richiesta.</div>'
    +'</div>');
}

function rigaFilo(r){
  const q = new Date(r.q).toLocaleString('it-IT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  /* I suoi messaggi da una parte, i nostri dall'altra: rileggere una
     conversazione e non capire chi ha detto cosa e' peggio che non averla
     riletta, e il nome da solo — con un omonimo — non basta. */
  const mio = r.x.da_cliente;
  const lato = mio ? 'mio' : 'nostro';
  if(r.tipo === 'msg'){
    return '<div class="bolla ' + lato + '">'
      + '<div class="chi">' + esc(mio ? 'Tu' : (r.x.autore_nome || 'With Us')) + ' · ' + esc(q) + '</div>'
      + '<div class="tx">' + esc(r.x.testo) + '</div></div>';
  }
  return '<div class="bolla ' + lato + '">'
    + '<div class="chi">' + esc(mio ? 'Tu' : 'With Us') + ' · ' + esc(q) + '</div>'
    + '<button class="allegato" onclick="scaricaAllegato(\'' + r.x.id + '\',this)">'
    + '<i class="ti ti-paperclip"></i> ' + esc(r.x.nome)
    + (r.x.dimensione ? ' <span>' + esc(pesoLeggibile(r.x.dimensione)) + '</span>' : '') + '</button></div>';
}

const pesoLeggibile = n => !n ? '' : (n < 1048576 ? Math.round(n/1024) + ' KB' : (n/1048576).toFixed(1).replace('.', ',') + ' MB');

async function mandaMessaggio(btn){
  const el = $('c-testo');
  const testo = (el && el.value || '').trim();
  if(!testo){ avviso('Scrivi qualcosa prima di mandarlo.'); if(el) el.focus(); return; }
  attesa(btn, 'Mando…');
  try{
    await conToken('mio-messaggio', { id: RICH_APERTA.richiesta.id, testo });
    if(el) el.value = '';
    libero(btn);
    await apriMiaRichiesta(RICH_APERTA.richiesta.id);
  }catch(e){ libero(btn); avviso(esc(e.message || 'Non riesco a mandarlo.')); }
}

async function mandaAllegato(input){
  const file = input.files && input.files[0]; if(!file) return;
  input.value = '';
  if(file.size > 10 * 1024 * 1024){ avviso('Il file supera i 10 MB: mandacelo più piccolo, o scrivici.'); return; }
  avviso('Mando ' + esc(file.name) + '…', 'ok');
  try{
    /* Il file si manda al NOSTRO server, non al deposito: il deposito non e'
       suo e non deve esserlo. Si trasforma in testo per farlo stare dentro una
       richiesta normale — un file da 10 MB ne fa circa 13, e ci stanno. */
    const dati = await new Promise((ok, no) => {
      const l = new FileReader();
      l.onerror = () => no(new Error('Non riesco a leggere il file.'));
      l.onload = () => ok(String(l.result).split(',')[1] || '');
      l.readAsDataURL(file);
    });
    await conToken('mio-allegato', { id: RICH_APERTA.richiesta.id, nome: file.name, tipo: file.type, dati });
    await apriMiaRichiesta(RICH_APERTA.richiesta.id);
  }catch(e){ avviso(esc(e.message || 'Non riesco a mandare il file.')); }
}

async function scaricaAllegato(id, btn){
  const old = btn ? btn.innerHTML : ''; if(btn){ btn.disabled = true; btn.innerHTML = 'Apro…'; }
  try{
    const { link } = await conToken('mio-allegato-link', { allegato: id });
    window.open(link, '_blank', 'noopener');
  }catch(e){ avviso(esc(e.message || 'Non riesco ad aprire il file.')); }
  finally{ if(btn){ btn.disabled = false; btn.innerHTML = old; } }
}

/* ── IL BATTITO ───────────────────────────────────────────────────────────────
   Serve a una cosa sola: far sapere all'agenzia chi c'e' adesso. Un segnale al
   minuto, e basta — non si legge niente in risposta, questa pagina non deve
   sapere chi altro e' collegato.

   SI FERMA QUANDO LA SCHEDA E' NASCOSTA. Una pagina lasciata aperta in un'altra
   scheda per tutto il pomeriggio non e' una persona che sta guardando: contarla
   fra i presenti vorrebbe dire dire un numero falso, ed e' un numero su cui si
   prendono decisioni. Riparte da sola quando si torna a guardarla. */
let TIC = null;
function battito(){
  const manda = () => { conToken('sono-qui', {}).catch(() => {}); };
  const parti = () => { if(TIC) return; manda(); TIC = setInterval(manda, 60000); };
  const fermati = () => { if(TIC){ clearInterval(TIC); TIC = null; } };
  if(!battito.__attaccato){
    battito.__attaccato = true;
    document.addEventListener('visibilitychange', () => {
      if(document.hidden) fermati(); else if(IO) parti();
    });
  }
  if(!document.hidden) parti();
}

/* ── I TUOI DATI ──────────────────────────────────────────────────────────────
   Li compila lui, ma li scrive il SERVER: sulla stessa riga ci sono anche cose
   che non sono sue — se e' un lead, chi e' l'intermediario — e aprirla in
   scrittura dal browser vorrebbe dire aprirla tutta.

   «Incompleta» non vuol dire «qualche casella vuota»: vuol dire che non ci si
   puo' fare un preventivo. Per questo il triangolo elenca CHE COSA manca, e non
   dice soltanto che manca qualcosa. */
const CAMPI_MIEI = [
  ['cognome','Cognome','text',1],       ['nome','Nome','text',1],
  ['codice_fiscale','Codice fiscale','text',1], ['data_nascita','Data di nascita','date',1],
  ['indirizzo','Indirizzo','text',1],   ['civico','Civico','text',1],
  ['comune','Comune','text',1],         ['cap','CAP','text',1],
  ['provincia','Provincia','text',1],   ['cellulare','Cellulare','tel',1],
  ['email','Email','email',1],          ['professione','Professione','text',0],
  ['partita_iva','Partita IVA','text',0], ['pec','PEC','email',0],
];

function avvisoDati(){
  const box = $('avviso-dati'); if(!box) return;
  if(!MANCA.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="allarme">'
    + '<i class="ti ti-alert-triangle-filled"></i>'
    + '<div><b>Mancano alcuni dati</b><div style="font-size:13px;margin-top:2px">'
    + 'Senza questi non riusciamo a farti un preventivo: ' + esc(MANCA.join(', ')) + '.</div>'
    + '<button class="link" style="padding:6px 0 0" onclick="vaiA(\'dati\')">Completali adesso</button></div></div>';
}

async function caricaMiaAnagrafica(){
  try{
    const r = await conToken('mia-anagrafica', {});
    ANAG = r.anagrafica; MANCA = r.manca || [];
  }catch(e){ ANAG = null; MANCA = []; }
  avvisoDati(); disegnaLinguette(); disegnaDati();
}

function disegnaDati(){
  const box = $('dati'); if(!box) return;
  if(!ANAG){
    box.className = 'muted';
    box.innerHTML = 'I tuoi dati non sono ancora pronti: riapri l\'area fra un minuto. Se continua, scrivici.';
    return;
  }
  box.className = '';
  const manca = new Set(MANCA);
  box.innerHTML = '<div class="muted" style="margin-bottom:14px">Servono a farti i preventivi e a emettere le polizze. '
      + 'Quelli con l\'asterisco sono necessari.</div>'
    + '<div id="msg-dati" class="msg"></div>'
    + '<div class="griglia">'
    + CAMPI_MIEI.map(([k, et, tipo, serve]) => {
        const vuoto = serve && manca.has(et);
        /* IL COMUNE SI SUGGERISCE, come in tutto il resto del gestionale:
           si scrivono due lettere e si sceglie dall'elenco, e provincia e CAP
           si riempiono da soli. Sono le due cose che si sbagliano piu' spesso —
           un CAP sbagliato e' una polizza che torna indietro dopo giorni. */
        const suggerisce = k === 'comune';
        return '<div class="f"' + (suggerisce ? ' style="position:relative"' : '') + '>'
          + '<label for="d-' + k + '">' + esc(et) + (serve ? ' *' : '')
          + (vuoto ? ' <i class="ti ti-alert-triangle-filled avviso"></i>' : '') + '</label>'
          + '<input id="d-' + k + '" type="' + tipo + '" value="' + esc(ANAG[k] == null ? '' : ANAG[k]) + '"'
          + (vuoto ? ' class="manca"' : '')
          + (suggerisce ? ' autocomplete="off" oninput="cercaComune(this)" onblur="comuneAlVolo(this)"' : '')
          + '>'
          + (suggerisce ? '<div class="sugg" id="sugg-comune"></div><div class="capnota" id="cap-nota"></div>' : '')
          + '</div>';
      }).join('')
    + '</div>'
    + '<button class="btn" onclick="salvaMieiDati(this)">Salva i miei dati</button>';
}

/* ── IL COMUNE SI SUGGERISCE ──────────────────────────────────────────────────
   «Appena si mette il comune deve consigliarti il comune e compilare
   automaticamente provincia e cap» — Francesco, 02/09/2026.

   STESSA FONTE DEL RESTO DEL GESTIONALE (comuni-json): un secondo elenco dei
   comuni italiano vorrebbe dire due elenchi che, con gli accorpamenti, prima o
   poi non dicono piu' la stessa cosa — e un CAP sbagliato e' una polizza che
   torna indietro dopo giorni.

   SE L'ELENCO NON ARRIVA, IL CAMPO RESTA SCRIVIBILE. Un suggerimento che non
   funziona non deve diventare un modulo che non si compila: chi non ha
   connessione, o chi abita in un comune che l'elenco non ha, scrive a mano
   esattamente come prima. */
let COMUNI = null, comuniInCorso = null, comuneTimer = null, COM_TROVATI = [];

function comuni(){
  if(COMUNI) return Promise.resolve(COMUNI);
  if(!comuniInCorso) comuniInCorso = fetch('https://cdn.jsdelivr.net/gh/matteocontrini/comuni-json@master/comuni.json')
    .then(r => r.json()).then(d => { COMUNI = d; return d; })
    .catch(() => { COMUNI = []; return []; });   // niente elenco: si scrive a mano
  return comuniInCorso;
}

const capDi = c => Array.isArray(c.cap) ? (c.cap[0] || '') : (c.cap || '');
const chiudiSugg = () => { const b = $('sugg-comune'); if(b){ b.className = 'sugg'; b.innerHTML = ''; } };

function cercaComune(input){
  clearTimeout(comuneTimer);
  const q = (input.value || '').trim();
  /* Sotto le due lettere l'elenco sarebbe mezzo Paese: si aspetta. E si aspetta
     un quarto di secondo dopo l'ultimo tasto, invece di cercare a ogni lettera
     mentre uno sta ancora scrivendo. */
  if(q.length < 2){ chiudiSugg(); return; }
  comuneTimer = setTimeout(async () => {
    const lista = await comuni();
    const ql = q.toLowerCase();
    /* Prima quelli che COMINCIANO come quello che ha scritto, poi quelli che lo
       contengono: chi scrive «pace» cerca Paceco, non Campobello di Pace. */
    const iniziano = lista.filter(c => c.nome.toLowerCase().startsWith(ql));
    const contengono = lista.filter(c => !c.nome.toLowerCase().startsWith(ql) && c.nome.toLowerCase().includes(ql));
    COM_TROVATI = iniziano.concat(contengono).slice(0, 8);
    const b = $('sugg-comune'); if(!b) return;
    if(!COM_TROVATI.length){ chiudiSugg(); return; }
    b.innerHTML = COM_TROVATI.map((c, i) =>
      '<button type="button" class="sv" onmousedown="event.preventDefault()" onclick="scegliComune(' + i + ')">'
      + '<b>' + esc(c.nome) + '</b> <span>(' + esc(c.sigla) + ')' + (capDi(c) ? ' · ' + esc(capDi(c)) : '') + '</span></button>').join('');
    b.className = 'sugg aperto';
  }, 250);
}

function scegliComune(i){
  const c = COM_TROVATI[i]; if(!c) return;
  const set = (id, v) => { const e = $('d-' + id); if(e && v) e.value = v; };
  set('comune', c.nome); set('provincia', c.sigla); set('cap', capDi(c));
  chiudiSugg();
  avvisoCap(c);
  /* Il CAP e' l'ultimo campo che resta da controllare: ci si va sopra da soli,
     invece di lasciarlo cercare. */
  const cap = $('d-cap'); if(cap) cap.focus();
}

function avvisoCap(c){
  /* UN COMUNE PUO' AVERE PIU' CAP. Palermo ne ha decine: mettere il primo e
     tacere vuol dire consegnare a caso un dato che decide dove arriva la posta.
     Si mette il primo — bisogna pur cominciare — ma si dice che va guardato. */
  const n = $('cap-nota'); if(!n) return;
  const quanti = Array.isArray(c.cap) ? c.cap.length : 1;
  n.innerHTML = quanti > 1
    ? '<i class="ti ti-info-circle"></i> ' + esc(c.nome) + ' ha ' + quanti + ' CAP: controlla che quello scritto sia il tuo.'
    : '';
}

function comuneAlVolo(input){
  /* Chi scrive il comune per intero e passa al campo dopo senza scegliere dalla
     lista non deve restare senza CAP e provincia: se quello che ha scritto e'
     esattamente un comune, e uno solo, si risolve lo stesso.
     Il ritardo serve perche' il clic sul suggerimento arriva dopo il blur. */
  setTimeout(async () => {
    chiudiSugg();
    const cap = $('d-cap'), prov = $('d-provincia');
    if(cap && cap.value && prov && prov.value) return;      // ha gia' tutto
    const q = (input.value || '').trim().toLowerCase();
    if(q.length < 3) return;
    const lista = await comuni();
    const esatti = lista.filter(c => c.nome.toLowerCase() === q);
    if(esatti.length !== 1) return;                          // due omonimi: decide lui
    const c = esatti[0];
    if(prov && !prov.value) prov.value = c.sigla;
    if(cap && !cap.value) cap.value = capDi(c);
    avvisoCap(c);
  }, 180);
}

async function salvaMieiDati(btn){
  const corpo = {};
  for(const [k] of CAMPI_MIEI){ const el = $('d-' + k); if(el) corpo[k] = el.value; }
  const msg = $('msg-dati');
  const dillo = (t, ok) => { if(msg){ msg.className = 'msg ' + (ok ? 'ok' : 'err'); msg.innerHTML = t; } };
  attesa(btn, 'Salvo…');
  try{
    const r = await conToken('salva-anagrafica', corpo);
    ANAG = r.anagrafica; MANCA = r.manca || [];
    libero(btn);
    disegnaDati(); avvisoDati(); disegnaLinguette();
    /* SI DICE CHE LA RESIDENZA E' IN VERIFICA. Senza, la rivede subito com'era
       prima e pensa che non sia stata salvata — e riprova, e riprova. */
    const inVerifica = r.residenzaDaVerificare
      ? ' La residenza che hai indicato risulta diversa da quella che abbiamo: la controlliamo noi e ti facciamo sapere.'
      : '';
    if(r.unita){
      /* SI DICE. Da questo momento vede polizze e preventivi che prima non
         c'erano: senza una parola, la prima reazione e' «di chi sono questi?».
         E si ricaricano subito, invece di farglieli trovare al prossimo giro. */
      caricaMiePolizze();
      dillo('Salvato. Ti conoscevamo già: abbiamo unito questa scheda a quella che avevi con noi, '
        + 'e trovi le tue polizze in «Le tue polizze».' + inVerifica
        + (MANCA.length ? ' Manca ancora: ' + esc(MANCA.join(', ')) + '.' : ''), true);
      return;
    }
    dillo((MANCA.length
      ? 'Salvato. Manca ancora: ' + esc(MANCA.join(', ')) + '.'
      : 'Salvato: i tuoi dati sono completi.') + inVerifica, !MANCA.length);
  }catch(e){
    libero(btn);
    dillo(esc(e.message || 'Non riesco a salvare.'));
  }
}

/* ── LE OFFERTE ───────────────────────────────────────────────────────────────
   Due posti diversi per due cose diverse: il BANNER in alto e' un richiamo
   breve che scorre, le SCHEDE sotto sono quelle da leggere. Il database
   consegna gia' solo quelle che valgono per questa convenzione e in questo
   periodo: una promozione scaduta non deve arrivare fin qui, perche' la prima
   cosa che perde credibilita' e' un'offerta finita il mese scorso. */
async function caricaOfferte(){
  try{
    const { data, error } = await db.from('quote_offerte').select('*').eq('attiva', true).order('ordine').order('creato_il');
    if(error) throw error;
    const tutte = data || [];
    const banner = tutte.filter(o => o.posto === 'banner');
    const schede = tutte.filter(o => o.posto === 'scheda');

    if(banner.length){
      /* Le voci si scrivono DUE volte: la pista scorre fino a meta' e riparte,
         e senza il doppione si vedrebbe il vuoto alla fine di ogni giro. */
      const voce = o => '<span class="voce"><span class="em">' + iconaHtml(o.icona, 'ti-star-filled') + '</span>' + esc(o.titolo)
        + (o.testo ? '<small>' + esc(o.testo) + '</small>' : '') + '</span>';
      const voci = banner.map(voce).join('');
      $('banner').innerHTML = '<div class="banner" tabindex="0" aria-label="Offerte in evidenza"><div class="pista">' + voci + voci + '</div></div>';
    }

    /* ── I POST ────────────────────────────────────────────────────────────
       «Uno spazio dove posso mettere dei post scorrevoli con offerte dedicate»
       — Francesco, 02/09/2026. Un post e' fatto per essere guardato: ha
       un'immagine e sta in una fila che scorre di lato, come si e' abituati.
       Le SCHEDE, sotto, sono quelle da leggere: due modi diversi perche' sono
       due cose diverse. */
    const post = tutte.filter(o => o.posto === 'post');
    const dentro = [];
    if(post.length){
      dentro.push('<div class="posts" tabindex="0" aria-label="Offerte dedicate">'
        + post.map(o => {
            const corpo = '<div class="p-testo"><div class="ti">' + esc(o.titolo) + '</div>'
              + (o.testo ? '<div class="tx">' + esc(o.testo) + '</div>' : '')
              + (o.al ? '<div class="fino">fino al ' + esc(new Date(o.al).toLocaleDateString('it-IT')) + '</div>' : '')
              + '</div>';
            /* L'immagine si carica solo quando serve e non sposta la pagina
               mentre arriva: un riquadro che salta sotto il dito e' il modo
               piu' rapido per far premere la cosa sbagliata. */
            const testa = o.immagine_url
              ? '<img src="' + esc(o.immagine_url) + '" alt="" loading="lazy" width="260" height="150">'
              : '<div class="p-vuota">' + iconaHtml(o.icona, 'ti-gift') + '</div>';
            const html = testa + corpo;
            return o.link
              ? '<a class="post" href="' + esc(o.link) + '" target="_blank" rel="noopener">' + html + '</a>'
              : '<div class="post">' + html + '</div>';
          }).join('')
        + '</div>');
    }
    if(schede.length){
      dentro.push(schede.map(o => '<div class="off"><div class="em">' + iconaHtml(o.icona, 'ti-gift') + '</div><div>'
          + '<div class="ti">' + esc(o.titolo) + '</div>'
          + (o.testo ? '<div class="tx">' + esc(o.testo) + '</div>' : '')
          + (o.al ? '<div class="fino">Valida fino al ' + esc(new Date(o.al).toLocaleDateString('it-IT')) + '</div>' : '')
          + '</div></div>').join(''));
    }
    const box = $('offerte'); if(!box) return;
    box.className = dentro.length ? '' : 'muted';
    box.innerHTML = dentro.length
      ? dentro.join('')
      /* Una sezione vuota che dice «carico…» per sempre fa pensare a un guasto.
         Se non ci sono offerte lo si dice, e si dice che ne arriveranno. */
      : 'Non ci sono offerte in questo momento. Appena ne prepariamo una la trovi qui.';
  }catch(e){
    /* Le offerte sono un di piu': se non arrivano, l'area funziona lo stesso e
       non si spaventa nessuno — ma la sezione non resta a «Carico…». */
    const box = $('offerte');
    if(box){ box.className = 'muted'; box.innerHTML = 'Le offerte non sono disponibili in questo momento.'; }
  }
}

/* ── COME SI DISEGNA UN'ICONA ─────────────────────────────────────────────────
   Le icone sono quelle del kit (Tabler), le stesse gia' usate in tutto il
   pannello: disegnate uguali fra loro, nitide su ogni schermo, e nel colore
   dell'agenzia. Le emoji invece le disegna il telefono, e la stessa faccina e'
   diversa su Android, su iPhone e su Windows.

   MA UN PRODOTTO SALVATO IERI HA ANCORA UN'EMOJI, e non deve sparire ne'
   diventare un quadratino: se il valore non e' un nome di icona, si mostra
   com'e'. Cosi' il passaggio non rompe niente e si completa da se'. */
function iconaHtml(v, difetto){
  const x = String(v || '').trim() || difetto;
  return /^ti-[a-z0-9-]+$/.test(x)
    ? '<i class="ti ' + x + '"></i>'
    : esc(x);
}

function urlNota(p){

}

/* ── LE TUE POLIZZE ───────────────────────────────────────────────────────────
   Le consegna il SERVER, gia' filtrate: questa pagina non sa niente dei rinnovi
   spenti, e non puo' mostrarli nemmeno sbagliando. Se un rinnovo e' acceso
   arriva col suo importo e la sua strada per pagarlo; se non lo e', non arriva.

   E l'importo che si mostra e' quello del RINNOVO, non quello dell'anno scorso:
   e' esattamente la cosa per cui il link resta spento finche' non lo guardiamo
   noi — «la polizza quell'anno è 200 e l'anno prossimo diventa 201 o 199». */
const euro = n => (n == null || n === '') ? '' : Number(n).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const dataBreve = d => { try { return new Date(d).toLocaleDateString('it-IT'); } catch (e) { return d || ''; } };

function quantoManca(al){
  if(!al) return null;
  const g = Math.ceil((new Date(al) - new Date()) / 86400000);
  if(g < 0) return ['scaduta il ' + dataBreve(al), '#fdecec', '#c0392b'];
  if(g === 0) return ['scade oggi', '#fdecec', '#c0392b'];
  if(g <= 30) return ['scade fra ' + g + (g === 1 ? ' giorno' : ' giorni'), '#fff4e5', '#8a5300'];
  return ['fino al ' + dataBreve(al), '#eef3ff', '#2b4bd8'];
}

function bloccoRinnovo(r){
  if(!r) return '';
  const righe = [];
  if(r.link) righe.push('<a href="' + esc(r.link) + '" target="_blank" rel="noopener" class="scegli" style="text-decoration:none;display:inline-block">Paga il rinnovo' + (r.premio != null ? ' · ' + esc(euro(r.premio)) : '') + '</a>');
  if(r.bonifico){
    const b = r.bonifico;
    /* L'IBAN si scrive per intero e si puo' copiare: chi lo ribatte a mano da
       un telefono sbaglia, e un bonifico sbagliato torna indietro dopo giorni. */
    righe.push('<div style="background:#f7f9fd;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6">'
      + '<div style="font-weight:800;margin-bottom:2px">Oppure con bonifico</div>'
      + (b.intestatario ? '<div>Intestato a <b>' + esc(b.intestatario) + '</b></div>' : '')
      + '<div style="font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px;word-break:break-all">' + esc(b.iban) + '</div>'
      + (b.banca ? '<div class="muted">' + esc(b.banca) + '</div>' : '')
      + '<div class="muted" style="margin-top:4px">Causale: rinnovo polizza' + (r.premio != null ? ' · importo ' + esc(euro(r.premio)) : '') + '</div>'
      + '</div>');
  }
  if(r.note) righe.push('<div class="muted" style="font-size:12.5px">' + esc(r.note) + '</div>');
  if(!righe.length) return '';
  return '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start">'
    + '<div style="font-size:12.5px;color:var(--muted);font-weight:700">RINNOVO PRONTO'
    + (r.scadenza ? ' · entro il ' + esc(dataBreve(r.scadenza)) : '') + '</div>'
    + righe.join('') + '</div>';
}

  try{

            + bloccoRinnovo(p.rinnovo)

        }).join('')
      /* Chi vede una polizza in scadenza SENZA il pulsante deve sapere che non

      + '<div class="muted" style="font-size:12.5px;margin-top:10px">Per le polizze in scadenza il pulsante per pagare compare qui appena abbiamo preparato il rinnovo: l\'importo può cambiare da un anno all\'altro, quindi lo controlliamo prima noi.</div>'

/* ── «SCEGLI» — IL MODULO DELLA RICHIESTA ─────────────────────────────────────
   QUALI DOMANDE FARE NON LE DECIDE QUESTA PAGINA. Ogni prodotto porta con se'
   l'elenco dei campi (targa, professione, indirizzo...) deciso dal pannello:
   cosi' un prodotto nuovo chiede cose nuove senza toccare una riga di codice.
   Se l'elenco e' vuoto, restano le tre domande che valgono sempre — da quando,
   come ti richiamiamo, e cosa ti serve — e il modulo funziona lo stesso. */
function campoHtml(c, i){
  const id = 'q-' + i;
  const obb = c.obbligatorio ? ' <span style="color:#c0392b">*</span>' : '';
  const et = '<label for="' + id + '" style="font-size:12.5px;color:var(--muted);font-weight:700">' + esc(c.etichetta || c.k).toUpperCase() + obb + '</label>';
  const stile = 'width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;margin-top:4px';
  let dentro;
  if(c.tipo === 'lungo') dentro = '<textarea id="' + id + '" rows="3" style="' + stile + ';resize:vertical"></textarea>';
  else if(c.tipo === 'scelta') dentro = '<select id="' + id + '" style="' + stile + '"><option value="">—</option>'
    + (Array.isArray(c.opzioni) ? c.opzioni : []).map(o => '<option>' + esc(o) + '</option>').join('') + '</select>';
  else dentro = '<input id="' + id + '" type="' + (c.tipo === 'data' ? 'date' : c.tipo === 'numero' ? 'number' : 'text')
    + '" ' + (c.aiuto ? 'placeholder="' + esc(c.aiuto) + '"' : '') + ' style="' + stile + '">';
  return '<div style="margin-bottom:12px">' + et + dentro + '</div>';
}

function scegli(id){
  const p = PRODOTTI.find(x => x.id === id); if(!p) return;
  DOMANDE = Array.isArray(p.campi) ? p.campi : [];
  document.querySelector('.card').className = 'card';
  /* Il PREMIO SUBITO non c'e' ancora, e non lo si fa credere: chi preme
     «Scegli» su un prodotto segnato «quotazione» deve sapere che per adesso
     rispondiamo noi, altrimenti aspetta davanti allo schermo un numero che non
     arrivera'. Si dice una volta, in chiaro, e non si nasconde. */
  const subito = p.modalita === 'quotazione';
  schermo(
     '<div style="display:flex;align-items:center;gap:12px;margin-bottom:2px">'
    +'<div class="ic" style="width:52px;height:52px;font-size:27px">' + iconaHtml(p.icona, 'ti-file-description') + '</div>'
    +'<div><h1 style="margin:0">' + esc(p.nome) + '</h1>'
    + (p.descrizione ? '<div class="muted" style="font-size:13.5px">' + esc(p.descrizione) + '</div>' : '') + '</div></div>'
    + (p.nota_percorso
        ? '<a class="nota" style="margin:10px 0;display:inline-flex" href="' + esc(urlNota(p.nota_percorso)) + '" target="_blank" rel="noopener"><i class="ti ti-file-text"></i> Leggi la nota informativa</a>'
        : '')
    +'<div class="msg ok" style="display:block;margin:12px 0">'
    + (subito
        ? 'Compila e invia: ti prepariamo il preventivo e te lo mandiamo per email. Il calcolo immediato del premio su questo prodotto lo stiamo attivando.'
        : 'Compila e invia: ti prepariamo il preventivo e te lo mandiamo per email.')
    +'</div>'
    +'<div id="msg" class="msg"></div>'
    + DOMANDE.map(campoHtml).join('')
    +'<div style="margin-bottom:12px"><label for="q-dec" style="font-size:12.5px;color:var(--muted);font-weight:700">DA QUANDO TI SERVE</label>'
    +'<input id="q-dec" type="date" style="width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;margin-top:4px"></div>'
    +'<div style="margin-bottom:12px"><label for="q-tel" style="font-size:12.5px;color:var(--muted);font-weight:700">TELEFONO PER RICHIAMARTI</label>'
    +'<input id="q-tel" type="tel" value="' + esc(IO.telefono || '') + '" style="width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;margin-top:4px"></div>'
    +'<div style="margin-bottom:14px"><label for="q-note" style="font-size:12.5px;color:var(--muted);font-weight:700">ALTRO CHE DOBBIAMO SAPERE</label>'
    +'<textarea id="q-note" rows="3" style="width:100%;box-sizing:border-box;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-family:inherit;margin-top:4px;resize:vertical"></textarea></div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button class="scegli" onclick="inviaRichiesta(\'' + p.id + '\',this)">Invia la richiesta</button>'
    +'<button class="scegli chiedi" onclick="schermoArea()">Torna indietro</button>'
    +'</div>');
}

async function inviaRichiesta(id, btn){
  const p = PRODOTTI.find(x => x.id === id); if(!p) return;
  const g = k => { const el = $(k); return el ? String(el.value || '').trim() : ''; };
  /* Il controllo di quello che manca sta ANCHE qui, ma non solo: quello che
     conta lo rifa' il server. Questo serve a non far fare un giro a vuoto a chi
     ha dimenticato un campo — glielo si dice subito, senza aspettare. */
  const risposte = {}, mancano = [];
  DOMANDE.forEach((c, i) => {
    const v = g('q-' + i);
    if(v) risposte[c.k] = v;
    else if(c.obbligatorio) mancano.push(c.etichetta || c.k);
  });
  if(mancano.length){ avviso('Manca ancora: ' + esc(mancano.join(', ')) + '.'); return; }
  attesa(btn, 'Invio…');
  try{
    await conToken('richiesta', {
      prodotto_id: p.id, risposte,
      decorrenza: g('q-dec') || null, telefono: g('q-tel'), note: g('q-note'),
    });
    document.querySelector('.card').className = 'card stretta';
    schermo(
       '<div style="text-align:center;padding:8px 0 4px"><div style="font-size:46px;line-height:1">✅</div>'
      +'<h1 style="margin:12px 0 6px">Richiesta inviata</h1>'
      +'<div class="muted" style="line-height:1.6">L\'abbiamo ricevuta e ti abbiamo mandato una conferma per email.<br>Ti rispondiamo con il preventivo per <b>' + esc(p.nome) + '</b>.</div>'
      +'<div style="margin-top:20px"><button class="scegli" onclick="schermoArea()">Torna alla mia area</button></div></div>');
  }catch(e){
    libero(btn);
    /* Non «Errore 500»: chi legge deve sapere se ha sbagliato lui o se e'
       colpa nostra, e in questo secondo caso che c'e' un'altra strada. */
    avviso(esc(e.message || 'Non riesco a inviare la richiesta.')
      + '<br><span style="font-size:12.5px">Se continua, scrivici su WhatsApp: la prendiamo lo stesso.</span>');
  }
}

// Avvio: se la sessione c'e' gia', si entra diretti.
db.auth.onAuthStateChange((ev) => { if(ev === 'PASSWORD_RECOVERY') schermoPassword(); });
dove();
</script>
