<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivo assicurazione — With Us</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{ --blue:#3b5bfd; --blue2:#2a45e0; --ink:#141a2e; --muted:#6b7488; --line:#e6e9f2; --c1:#1c8a52; --c2:#0f6b3c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f7fb;}
  a{text-decoration:none}
  /* HERO banner */
  .hero{position:relative;min-height:420px;display:flex;align-items:stretch;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.9;}
  .hero-ov{position:absolute;inset:0;background:linear-gradient(105deg,rgba(8,30,18,.92) 0%,rgba(8,30,18,.72) 38%,rgba(8,30,18,.18) 62%,rgba(8,30,18,0) 100%);}
  .hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;padding:40px 26px;align-items:center;}
  @media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:18px;padding:30px 20px}}
  .brand{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;letter-spacing:1px;font-size:14px;opacity:.95;margin-bottom:10px;}
  .hl{color:#fff;font-size:38px;line-height:1.08;font-weight:900;margin:0;text-shadow:0 3px 18px rgba(0,0,0,.3);}
  .hl .accent{color:#aef5c8;}
  @media(max-width:820px){.hl{font-size:29px}}
  .claim{color:#eafff2;font-size:16px;line-height:1.5;margin:14px 0 16px;max-width:520px;opacity:.96;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:6px 13px;font-size:12.5px;font-weight:700;}
  .cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--c2);font-weight:800;padding:13px 22px;border-radius:30px;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.2);}
  /* price card */
  .pcard{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.22);}
  .pcard .ph{font-weight:900;font-size:17px;color:var(--ink);line-height:1.15;}
  .pcard .psub{font-size:12.5px;color:var(--muted);margin:2px 0 12px;}
  .price-big{text-align:center;margin:6px 0 12px;}
  .price-big .da{font-size:13px;color:var(--muted);font-weight:700;}
  .price-big .v{font-size:46px;font-weight:900;color:var(--c1);line-height:1;}
  .price-big .u{font-size:14px;color:var(--muted);font-weight:700;}
  .qrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;}
  .qrow select,.qseg{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;border:none;background:#fff;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--muted);}
  .seg button.on{background:var(--c1);color:#fff;}
  .incl{list-style:none;padding:0;margin:10px 0 0;}
  .incl li{display:flex;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line);}
  .incl li:first-child{border-top:none;} .incl i{color:var(--c1);font-size:18px;flex-shrink:0;}
  .pcta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;padding:13px;border-radius:30px;font-size:15px;border:none;cursor:pointer;}
  /* form section */
  .sec{max-width:1080px;margin:0 auto;padding:26px 22px 46px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:820px){.sec{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;}
  .card h2{margin:0 0 12px;font-size:18px;}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(28,138,82,.12);}
  textarea{min-height:64px;resize:vertical;}
  .hp{position:absolute;left:-9999px;}
  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .consent input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:16px;font-weight:800;cursor:pointer;}
  .btn:disabled{opacity:.6}.msg{margin-top:10px;font-size:13px;text-align:center}.err{color:#c0392b}
  .done{text-align:center;padding:24px 6px}.done .ic2{width:66px;height:66px;border-radius:50%;background:#e7f8ee;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:36px;color:var(--c1)}
  .foot{text-align:center;color:#9aa2b5;font-size:12px;padding:0 22px 28px}
  .ck-ov{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
  .ck-box{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
  .ck-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-size:16px}
  .ck-x{background:#eef1f6;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
  .ck-body{padding:18px}
</style>
</head>
<body>
<section class="hero" id="hero">
  <img class="hero-img" id="hero-img" alt="" onerror="this.style.display='none'">
  <div class="hero-ov"></div>
  <div class="hero-in">
    <div>
      <div class="brand"><img src="withus-logo-white.png" alt="With Us Assicurazioni" style="height:36px;width:auto;display:block"></div>
      <h1 class="hl" id="hl"></h1>
      <p class="claim" id="claim"></p>
      <div class="chips"><span class="chip"><i class="ti ti-clock-bolt"></i> Richiesta semplice</span><span class="chip"><i class="ti ti-bolt"></i> Risposta rapida</span></div>
      <a class="cta" href="#richiedi">Scopri di più <i class="ti ti-arrow-right"></i></a>
    </div>
    <div class="pcard" id="pcard"></div>
  </div>
</section>

<section class="sec">
  <div class="card">
    <h2>Perché sceglierla</h2>
    <ul class="incl" id="benef"></ul>
    <p style="color:var(--muted);font-size:12px;margin-top:14px" id="note"></p>
  </div>
  <div class="card" id="form-area" style="scroll-margin-top:14px"><a id="richiedi"></a>
    <h2 id="f-title">Chiedi informazioni</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 8px">Lasciaci i dati: ti ricontattiamo noi, senza impegno.</p>
    <form id="lead-form">
      <input class="hp" id="azienda_web" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>Nome e cognome *</label><input id="nome" required placeholder="Mario Rossi">
      <label>Telefono</label><input id="telefono" type="tel" inputmode="tel" placeholder="333 1234567">
      <label>Email</label><input id="email" type="email" inputmode="email" placeholder="mario.rossi@email.it">
      <label>Messaggio (facoltativo)</label><textarea id="messaggio" placeholder="Le tue esigenze…"></textarea>
      <label class="consent"><input type="checkbox" id="privacy" required> Acconsento al trattamento dei dati per essere ricontattato (Reg. UE 2016/679).</label>
      <button class="btn" id="submit" type="submit">Invia richiesta</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</section>
<div class="foot">With Us Società Cooperativa · Via Cofano 76, 91100 Trapani · RUI A000747484</div>

<script>

  'aglea-salute360': { nome:'Salute 360', c1:'#1565c0', c2:'#0d47a1', img:IMG('1576091160399-112ba8d25d1d'),
    hl:'<span class="accent">Salute 360</span>: protezione completa, giovane e famiglia.',
    claim:'Prodotto sanitario con ricovero, prevenzione, extra ospedaliere e assistenza gravi eventi.',
    benef:['GIC 70.000 € · ricovero 35.000 €','Parto e interventi ambulatoriali','Alta diagnostica e visite','Assistenza gravi eventi'],
    quote:{ tipo:'opzioni', opzioni:[{l:'Singolo',p:1160},{l:'Nucleo',p:1960}] } },
  'aglea-senis': { nome:'Senis Assistance', c1:'#00695c', c2:'#004d40', img:IMG('1576091160399-112ba8d25d1d'),

  infortuni: { nome:'Infortuni', c1:'#e8590c', c2:'#c44307', img:IMG('1571019613454-24bc7b8f0c10'),
    hl:'Un sostegno quando serve <span class="accent">davvero</span>.',

  tutela:    { nome:'Tutela Legale', c1:'#5b3fb5', c2:'#3f2a86', img:IMG('1589829545856-d10d557cf95f'),

    quote:{ tipo:'opzioni', from:true, opzioni:[{l:'My Drive · veicoli',p:31},{l:'My Way · vita privata',p:113},{l:'Rimborso Utenze',p:36}] } },

  animali:   { nome:'Animali domestici', c1:'#c2255c', c2:'#9c1c49', img:IMG('1601758228041-f3b2795255f1'),

const params = new URLSearchParams(location.search);
const key = (params.get('prodotto') || 'vita').toLowerCase();
const fonte = params.get('fonte') || (document.referrer || 'landing');
const P = PRODOTTI[key] || PRODOTTI.vita;
// var (non const) così i gestori onclick/onchange inline trovano le variabili
var SS = { tipo:'attiva', liv:'base', comp:'s' };
var QS = { opt:0, addon:false };

document.documentElement.style.setProperty('--c1', P.c1);
document.documentElement.style.setProperty('--c2', P.c2);
document.getElementById('hero').style.setProperty('--c1', P.c1);
document.getElementById('hero').style.setProperty('--c2', P.c2);
document.getElementById('hero-img').src = P.img;
document.getElementById('hl').innerHTML = P.hl;
document.getElementById('claim').textContent = P.claim;
document.getElementById('f-title').textContent = 'Chiedi informazioni · ' + P.nome;
document.title = 'Preventivo ' + P.nome + ' — With Us';
document.getElementById('benef').innerHTML = (P.benef||[]).map(b=>'<li><i class="ti ti-circle-check"></i> '+b+'</li>').join('');
const eur = n => '€ ' + Number(n).toLocaleString('it-IT');

function renderPcard(){
  const q = P.quote || {tipo:'lead'};
  let priceHtml='';
  if (q.tipo==='fisso'){
    priceHtml = '<div class="price-big"><div class="da">a partire da</div><div class="v">€ '+q.mese+'</div><div class="u">al mese · ('+eur(q.anno)+'/anno)</div></div>'
      + '<div style="text-align:center;font-size:11.5px;color:var(--muted)">Prezzo pubblico, emissione immediata su QUOTO.</div>';
  } else if (q.tipo==='salute'){
    const v = SAL[SS.tipo][SS.liv][SS.comp];
    priceHtml =
      '<div class="qrow"><select onchange="SS.tipo=this.value;upd()"><option value="attiva"'+(SS.tipo==='attiva'?' selected':'')+'>Attiva</option><option value="protezione"'+(SS.tipo==='protezione'?' selected':'')+'>Protezione</option></select>'
      + '<select onchange="SS.liv=this.value;upd()"><option value="base"'+(SS.liv==='base'?' selected':'')+'>Base</option><option value="plus"'+(SS.liv==='plus'?' selected':'')+'>Plus</option><option value="plat"'+(SS.liv==='plat'?' selected':'')+'>Platinum</option></select></div>'
      + '<div class="seg"><button class="'+(SS.comp==='s'?'on':'')+'" onclick="SS.comp=\'s\';upd()">Singolo</button><button class="'+(SS.comp==='n'?'on':'')+'" onclick="SS.comp=\'n\';upd()">Nucleo</button></div>'
      + '<div class="price-big" style="margin-top:12px"><div class="da">il tuo preventivo</div><div class="v">'+eur(v)+'</div><div class="u">all\'anno · ('+eur(Math.round(v/12))+'/mese)</div></div>';
  } else if (q.tipo==='aglea'){
    const linea = q.linea, v = SAL[linea][SS.liv][SS.comp];
    priceHtml =
      '<div class="qrow"><select onchange="SS.liv=this.value;upd()"><option value="base"'+(SS.liv==='base'?' selected':'')+'>Base</option><option value="plus"'+(SS.liv==='plus'?' selected':'')+'>Plus</option><option value="plat"'+(SS.liv==='plat'?' selected':'')+'>Platinum</option></select></div>'
      + '<div class="seg"><button class="'+(SS.comp==='s'?'on':'')+'" onclick="SS.comp=\'s\';upd()">Singolo</button><button class="'+(SS.comp==='n'?'on':'')+'" onclick="SS.comp=\'n\';upd()">Nucleo</button></div>'
      + '<div class="price-big" style="margin-top:12px"><div class="da">il tuo preventivo</div><div class="v">'+eur(v)+'</div><div class="u">all\'anno · ('+eur(Math.round(v/12))+'/mese)</div></div>';
  } else if (q.tipo==='opzioni'){
    const o = q.opzioni[QS.opt] || q.opzioni[0];
    const tot = o.p + (q.addon && QS.addon ? q.addon.p : 0);
    let ctrl = '<div class="qrow"><select onchange="QS.opt=+this.value;upd()">'+q.opzioni.map((x,i)=>'<option value="'+i+'"'+(QS.opt===i?' selected':'')+'>'+x.l+'</option>').join('')+'</select></div>';
    if (q.addon) ctrl += '<label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:4px 0 2px"><input type="checkbox" '+(QS.addon?'checked':'')+' onchange="QS.addon=this.checked;upd()" style="width:18px;height:18px"> '+q.addon.l+' (+'+eur(q.addon.p)+')</label>';
    priceHtml = ctrl + '<div class="price-big" style="margin-top:8px"><div class="da">'+(q.from?'a partire da':'il tuo preventivo')+'</div><div class="v">'+eur(tot)+'</div><div class="u">all\'anno'+(q.from?'':' · ('+eur(Math.round(tot/12))+'/mese)')+'</div></div>';
  } else {
    priceHtml = '<div class="price-big"><div class="da">preventivo</div><div class="v" style="font-size:30px">Su misura</div><div class="u">in base alle tue esigenze</div></div>';
  }
  document.getElementById('pcard').innerHTML =
    '<div class="ph">'+P.nome+'</div><div class="psub">With Us Assicurazioni</div>'
    + priceHtml
    + '<ul class="incl">'+(P.benef||[]).slice(0,3).map(b=>'<li><i class="ti ti-check"></i> '+b+'</li>').join('')+'</ul>'
    + (isQuotabile() ? '<button class="pcta" onclick="apriCheckout()"><i class="ti ti-shopping-cart"></i> ACQUISTA E PAGA ORA</button>' : '')
    + '<button class="pcta" style="background:#eef1f6;color:var(--ink);margin-top:8px" onclick="document.getElementById(\'richiedi\').scrollIntoView({behavior:\'smooth\'})"><i class="ti ti-phone"></i> CHIEDI INFORMAZIONI</button>';
}
function upd(){ renderPcard(); }
renderPcard();

document.getElementById('lead-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg=document.getElementById('msg'), btn=document.getElementById('submit');
  const nome=document.getElementById('nome').value.trim();
  const email=document.getElementById('email').value.trim();
  const telefono=document.getElementById('telefono').value.trim();
  if(!nome||(!email&&!telefono)){ msg.className='msg err'; msg.textContent='Inserisci nome e almeno un contatto.'; return; }
  btn.disabled=true; msg.className='msg'; msg.textContent='Invio…';
  try{
    const r=await fetch(API+'/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      nome:nome,email:email,telefono:telefono,prodotto:P.nome,
      messaggio:document.getElementById('messaggio').value.trim(),fonte:'landing · '+fonte,
      azienda_web:document.getElementById('azienda_web').value
    })});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||'Invio non riuscito');
    document.getElementById('form-area').innerHTML='<div class="done"><div class="ic2">✓</div><div style="font-weight:800;font-size:18px;margin-bottom:6px">Richiesta inviata!</div><div style="color:#6b7488">Grazie '+nome.split(' ')[0]+', ti ricontattiamo al più presto.</div></div>';
  }catch(err){ btn.disabled=false; msg.className='msg err'; msg.textContent=err.message||'Errore, riprova.'; }
});

// ── Acquista e paga online (checkout pubblico) ───────────────────────────────────
function isQuotabile(){ const t=(P.quote||{}).tipo; return !!t && t!=='lead'; }
function currentParams(){ return { liv:SS.liv, comp:SS.comp, tipo:SS.tipo, opt:QS.opt, addon:QS.addon }; }
var PAYCFG={loaded:false}, CK={};
async function payConfig(){ if(!PAYCFG.loaded){ const c=await fetch(API+'/pay/config').then(r=>r.json()).catch(()=>({})); Object.assign(PAYCFG,c,{loaded:true}); } return PAYCFG; }
function apriCheckout(){
  if(!isQuotabile()) return; CK={cliente:null};
  const ov=document.createElement('div'); ov.id='ck-ov'; ov.className='ck-ov';
  ov.innerHTML='<div class="ck-box"><div class="ck-head"><b>Acquista · '+P.nome+'</b><button class="ck-x" onclick="document.getElementById(\'ck-ov\').remove()"><i class="ti ti-x"></i></button></div><div class="ck-body" id="ck-body"></div></div>';
  document.body.appendChild(ov); ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });
  ckStepData();
}
function ckStepData(){
  document.getElementById('ck-body').innerHTML=
    '<p style="color:var(--muted);font-size:13px;margin:0 0 8px">Dati dell\'intestatario, poi pagamento sicuro.</p>'
    +'<input class="hp" id="ck-hp">'
    +'<label>Nome *</label><input id="ck-nome">'
    +'<label>Cognome *</label><input id="ck-cognome">'
    +'<label>Codice fiscale *</label><input id="ck-cf" style="text-transform:uppercase">'
    +'<label>Email *</label><input id="ck-email" type="email">'
    +'<label>Telefono</label><input id="ck-tel" type="tel">'
    +'<label class="consent"><input type="checkbox" id="ck-priv"> Acconsento al trattamento dei dati (Reg. UE 2016/679).</label>'
    +'<button class="btn" onclick="ckToPay()">Procedi al pagamento →</button><div class="msg err" id="ck-err"></div>';
}
function ckToPay(){
  const g=id=>document.getElementById(id).value.trim(), err=document.getElementById('ck-err');
  const c={ nome:g('ck-nome'), cognome:g('ck-cognome'), cf:g('ck-cf').toUpperCase(), email:g('ck-email'), telefono:g('ck-tel') };
  if(document.getElementById('ck-hp').value) return;
  if(!c.nome||!c.cognome||!c.cf||!c.email){ err.textContent='Compila i campi obbligatori.'; return; }
  if(!document.getElementById('ck-priv').checked){ err.textContent='Devi accettare il consenso privacy.'; return; }
  CK.cliente=c; ckStepDocs();
}
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
async function ckUpload(file){ const data=await fileToB64(file); const r=await fetch(API+'/shop/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,contentType:file.type,data})}).then(x=>x.json()); if(!r.ok) throw new Error(r.error||'Caricamento fallito'); return {nome:file.name, url:r.url}; }
function ckStepDocs(){
  document.getElementById('ck-body').innerHTML=
    '<p style="color:var(--muted);font-size:13px;margin:0 0 8px">Carica i documenti e conferma le accettazioni, poi paga.</p>'
    +'<label>Documento d\'identità (fronte/retro) *</label><input id="ck-doc-id" type="file" accept="image/*,application/pdf" multiple>'
    +'<label>Tessera sanitaria / Codice fiscale (facoltativo)</label><input id="ck-doc-cf" type="file" accept="image/*,application/pdf">'
    +'<label class="consent" style="margin-top:14px"><input type="checkbox" id="ck-acc1"> Dichiaro che i dati e i documenti forniti sono veritieri.</label>'
    +'<label class="consent"><input type="checkbox" id="ck-acc2"> Ho preso visione dell\'informativa precontrattuale e del set informativo del prodotto (DIP/IVASS).</label>'
    +'<button class="btn" id="ck-doc-next" onclick="ckDocsNext()">Procedi al pagamento →</button><div class="msg err" id="ck-derr"></div>';
}
async function ckDocsNext(){
  const err=document.getElementById('ck-derr'); const idFiles=document.getElementById('ck-doc-id').files;
  if(!idFiles.length){ err.className='msg err'; err.textContent='Carica il documento d\'identità.'; return; }
  if(!document.getElementById('ck-acc1').checked||!document.getElementById('ck-acc2').checked){ err.className='msg err'; err.textContent='Conferma le accettazioni.'; return; }
  const btn=document.getElementById('ck-doc-next'); btn.disabled=true; err.className='msg'; err.textContent='Caricamento documenti…';
  try{
    CK.documenti=[];
    for(const f of idFiles) CK.documenti.push(await ckUpload(f));
    const cf=document.getElementById('ck-doc-cf').files[0]; if(cf) CK.documenti.push(await ckUpload(cf));
    CK.accettazioni={ veridicita:true, precontrattuale:true, ts:new Date().toISOString() };
    ckStepPay();
  }catch(e){ btn.disabled=false; err.className='msg err'; err.textContent=e.message||'Errore nel caricamento'; }
}
async function ckStepPay(){
  const params=currentParams(), prodotto=key;
  document.getElementById('ck-body').innerHTML=
    '<div id="ck-amt" style="text-align:center;font-weight:800;font-size:18px;margin-bottom:4px">Calcolo…</div>'
    +'<div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:14px">Pagamento sicuro · carta o PayPal</div>'
    +'<div id="ck-stripe"></div><button class="btn" id="ck-stripe-pay" style="display:none">Paga con carta</button>'
    +'<div style="text-align:center;color:var(--muted);font-size:12px;margin:14px 0 8px">— oppure —</div>'
    +'<div id="ck-paypal"></div><div class="msg" id="ck-pmsg"></div>';
  try{
    const cfg=await payConfig();
    if(cfg.stripePublishableKey){
      if(!window.Stripe) await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://js.stripe.com/v3/';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      const stripe=window.Stripe(cfg.stripePublishableKey);
      const intent=await fetch(API+'/shop/checkout/stripe/create-intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prodotto,params})}).then(r=>r.json());
      if(intent.clientSecret){
        document.getElementById('ck-amt').textContent='Totale € '+Number(intent.prezzo).toFixed(2)+'/anno';
        const elements=stripe.elements({clientSecret:intent.clientSecret});
        elements.create('payment').mount('#ck-stripe');
        const btn=document.getElementById('ck-stripe-pay'); btn.style.display='block';
        btn.onclick=async()=>{ btn.disabled=true; const m=document.getElementById('ck-pmsg'); m.className='msg'; m.textContent='Pagamento in corso…';
          const {error,paymentIntent}=await stripe.confirmPayment({elements,redirect:'if_required'});
          if(error){ m.className='msg err'; m.textContent=error.message; btn.disabled=false; return; }
          const c=await fetch(API+'/shop/checkout/stripe/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:paymentIntent.id,prodotto,params,cliente:CK.cliente,documenti:CK.documenti,accettazioni:CK.accettazioni})}).then(r=>r.json());
          if(c.ok) ckDone(); else { m.className='msg err'; m.textContent=c.error||'Errore'; btn.disabled=false; } };
      } else { document.getElementById('ck-amt').textContent=intent.error||'Prodotto non acquistabile online'; }
    }
    if(cfg.paypalClientId){
      if(!window.paypal) await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(cfg.paypalClientId)+'&currency=EUR&intent=capture';s.onload=res;s.onerror=rej;document.head.appendChild(s);});
      window.paypal.Buttons({ style:{height:42,label:'pay'},
        createOrder:async()=>{ const o=await fetch(API+'/shop/checkout/paypal/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prodotto,params})}).then(r=>r.json()); return o.id; },
        onApprove:async(data)=>{ const m=document.getElementById('ck-pmsg'); m.className='msg'; m.textContent='Confermo…'; const c=await fetch(API+'/shop/checkout/paypal/capture',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId:data.orderID,prodotto,params,cliente:CK.cliente,documenti:CK.documenti,accettazioni:CK.accettazioni})}).then(r=>r.json()); if(c.ok) ckDone(); else { m.className='msg err'; m.textContent=c.error||'Errore'; } },
        onError:()=>{ const m=document.getElementById('ck-pmsg'); m.className='msg err'; m.textContent='Errore PayPal'; }
      }).render('#ck-paypal');
    }
  }catch(e){ const m=document.getElementById('ck-pmsg'); if(m){ m.className='msg err'; m.textContent=e.message||'Errore'; } }
}
function ckDone(){ document.getElementById('ck-body').innerHTML='<div class="done"><div class="ic2">✓</div><div style="font-weight:800;font-size:18px;margin-bottom:6px">Pagamento riuscito!</div><div style="color:#6b7488">Grazie '+(CK.cliente?CK.cliente.nome:'')+'. Ti abbiamo inviato un\'<b>email per firmare a distanza</b> l\'informativa privacy e la documentazione precontrattuale (con un codice OTP). Controlla la tua casella di posta — anche nello spam — e completa la firma per attivare la polizza.</div></div>'; }
</script>
