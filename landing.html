<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivo assicurazione — With Us</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{ --blue:#3b5bfd; --blue2:#2a45e0; --ink:#141a2e; --muted:#6b7488; --line:#e6e9f2; --c1:#1c8a52; --c2:#0f6b3c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f7fb;}
  a{text-decoration:none}
  /* HERO banner */
  .hero{position:relative;min-height:420px;display:flex;align-items:stretch;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;opacity:.9;}
  .hero-ov{position:absolute;inset:0;background:linear-gradient(105deg,rgba(8,30,18,.92) 0%,rgba(8,30,18,.72) 38%,rgba(8,30,18,.18) 62%,rgba(8,30,18,0) 100%);}
  .hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;width:100%;display:grid;grid-template-columns:1.15fr .85fr;gap:30px;padding:40px 26px;align-items:center;}
  @media(max-width:820px){.hero-in{grid-template-columns:1fr;gap:18px;padding:30px 20px}}
  .brand{display:inline-flex;align-items:center;gap:8px;color:#fff;font-weight:800;letter-spacing:1px;font-size:14px;opacity:.95;margin-bottom:10px;}
  .hl{color:#fff;font-size:38px;line-height:1.08;font-weight:900;margin:0;text-shadow:0 3px 18px rgba(0,0,0,.3);}
  .hl .accent{color:#aef5c8;}
  @media(max-width:820px){.hl{font-size:29px}}
  .claim{color:#eafff2;font-size:16px;line-height:1.5;margin:14px 0 16px;max-width:520px;opacity:.96;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:22px;padding:6px 13px;font-size:12.5px;font-weight:700;}
  .cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--c2);font-weight:800;padding:13px 22px;border-radius:30px;font-size:15px;box-shadow:0 10px 24px rgba(0,0,0,.2);}
  /* price card */
  .pcard{background:#fff;border-radius:18px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.22);}
  .pcard .ph{font-weight:900;font-size:17px;color:var(--ink);line-height:1.15;}
  .pcard .psub{font-size:12.5px;color:var(--muted);margin:2px 0 12px;}
  .price-big{text-align:center;margin:6px 0 12px;}
  .price-big .da{font-size:13px;color:var(--muted);font-weight:700;}
  .price-big .v{font-size:46px;font-weight:900;color:var(--c1);line-height:1;}
  .price-big .u{font-size:14px;color:var(--muted);font-weight:700;}
  .qrow{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;}
  .qrow select,.qseg{flex:1;min-width:120px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;}
  .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;border:none;background:#fff;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--muted);}
  .seg button.on{background:var(--c1);color:#fff;}
  .incl{list-style:none;padding:0;margin:10px 0 0;}
  .incl li{display:flex;gap:8px;font-size:13px;padding:6px 0;border-top:1px solid var(--line);}
  .incl li:first-child{border-top:none;} .incl i{color:var(--c1);font-size:18px;flex-shrink:0;}
  .pcta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-weight:800;padding:13px;border-radius:30px;font-size:15px;border:none;cursor:pointer;}
  /* form section */
  .sec{max-width:1080px;margin:0 auto;padding:26px 22px 46px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
  @media(max-width:820px){.sec{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;}
  .card h2{margin:0 0 12px;font-size:18px;}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(28,138,82,.12);}
  textarea{min-height:64px;resize:vertical;}
  .hp{position:absolute;left:-9999px;}
  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .consent input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:16px;font-weight:800;cursor:pointer;}
  .btn:disabled{opacity:.6}.msg{margin-top:10px;font-size:13px;text-align:center}.err{color:#c0392b}
  .done{text-align:center;padding:24px 6px}.done .ic2{width:66px;height:66px;border-radius:50%;background:#e7f8ee;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:36px;color:var(--c1)}
  .foot{text-align:center;color:#9aa2b5;font-size:12px;padding:0 22px 28px}
  .ck-ov{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9999}
  .ck-box{background:#fff;border-radius:16px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
  .ck-head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);font-size:16px}
  .ck-x{background:#eef1f6;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px}
  .ck-body{padding:18px}
  .geo-wrap{position:relative}
  .geo-res{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;max-height:210px;overflow:auto;box-shadow:0 12px 28px rgba(10,20,40,.16);display:none}
  .geo-res.show{display:block}
  .geo-item{padding:9px 12px;font-size:13.5px;cursor:pointer;border-top:1px solid #f0f2f7}
  .geo-item:first-child{border-top:none}
  .geo-item:hover{background:#f5f7ff}
</style>
</head>
<body>
<section class="hero" id="hero">
  <img class="hero-img" id="hero-img" alt="" onerror="this.style.display='none'">
  <div class="hero-ov"></div>
  <div class="hero-in">
    <div>
      <div class="brand"><img src="withus-logo-white.png" alt="With Us Assicurazioni" style="height:36px;width:auto;display:block"></div>
      <h1 class="hl" id="hl"></h1>
      <p class="claim" id="claim"></p>
      <div class="chips"><span class="chip"><i class="ti ti-clock-bolt"></i> Richiesta semplice</span><span class="chip"><i class="ti ti-bolt"></i> Risposta rapida</span></div>
      <a class="cta" href="#richiedi">Scopri di più <i class="ti ti-arrow-right"></i></a>
    </div>
    <div class="pcard" id="pcard"></div>
  </div>
</section>

<section class="sec">
  <div class="card">
    <h2>Perché sceglierla</h2>
    <ul class="incl" id="benef"></ul>
    <p style="color:var(--muted);font-size:12px;margin-top:14px" id="note"></p>
  </div>
  <div class="card" id="form-area" style="scroll-margin-top:14px"><a id="richiedi"></a>
    <h2 id="f-title">Chiedi informazioni</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:0 0 8px">Lasciaci i dati: ti ricontattiamo noi, senza impegno.</p>
    <form id="lead-form">
      <input class="hp" id="azienda_web" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>Nome e cognome *</label><input id="nome" required placeholder="Mario Rossi">
      <label>Telefono</label><input id="telefono" type="tel" inputmode="tel" placeholder="333 1234567">
      <label>Email</label><input id="email" type="email" inputmode="email" placeholder="mario.rossi@email.it">
      <label>Messaggio (facoltativo)</label><textarea id="messaggio" placeholder="Le tue esigenze…"></textarea>
      <label class="consent"><input type="checkbox" id="privacy" required> Acconsento al trattamento dei dati per essere ricontattato (Reg. UE 2016/679).</label>
      <button class="btn" id="submit" type="submit">Invia richiesta</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</section>
<div class="foot">With Us Società Cooperativa · Via Cofano 76, 91100 Trapani · RUI A000747484</div>

<script>
const API = 'https://withus-backend-o0ux.onrender.com';

  'aglea-salute360': { nome:'Salute 360', c1:'#1565c0', c2:'#0d47a1', img:IMG('1576091160399-112ba8d25d1d'),
    hl:'<span class="accent">Salute 360</span>: protezione completa, giovane e famiglia.',
    claim:'Prodotto sanitario con ricovero, prevenzione, extra ospedaliere e assistenza gravi eventi.',

  infortuni: { nome:'Infortuni', c1:'#e8590c', c2:'#c44307', img:IMG('1571019613454-24bc7b8f0c10'),
    hl:'Un sostegno quando serve <span class="accent">davvero</span>.',

  tutela:    { nome:'Tutela Legale', c1:'#5b3fb5', c2:'#3f2a86', img:IMG('1589829545856-d10d557cf95f'),

    quote:{ tipo:'opzioni', from:true, opzioni:[{l:'My Drive · veicoli',p:31},{l:'My Way · vita privata',p:113},{l:'Rimborso Utenze',p:36}] } },
  viaggio:   { nome:'Viaggio', c1:'#0c8599', c2:'#096477', img:IMG('1488646953014-85cb44e25828'),

const params = new URLSearchParams(location.search);
const key = (params.get('prodotto') || 'vita').toLowerCase();
const fonte = params.get('fonte') || (document.referrer || 'landing');
const P = PRODOTTI[key] || PRODOTTI.vita;
// var (non const) così i gestori onclick/onchange inline trovano le variabili
var SS = { tipo:'attiva', liv:'base', comp:'s' };
var QS = { opt:0, addon:false };

document.documentElement.style.setProperty('--c1', P.c1);
document.documentElement.style.setProperty('--c2', P.c2);
document.getElementById('hero').style.setProperty('--c1', P.c1);
document.getElementById('hero').style.setProperty('--c2', P.c2);
document.getElementById('hero-img').src = P.img;
document.getElementById('hl').innerHTML = P.hl;
document.getElementById('claim').textContent = P.claim;
document.getElementById('f-title').textContent = 'Chiedi informazioni · ' + P.nome;
document.title = 'Preventivo ' + P.nome + ' — With Us';
document.getElementById('benef').innerHTML = (P.benef||[]).map(b=>'<li><i class="ti ti-circle-check"></i> '+b+'</li>').join('');
const eur = n => '€ ' + Number(n).toLocaleString('it-IT');

function renderPcard(){
  const q = P.quote || {tipo:'lead'};
  let priceHtml='';
  if (q.tipo==='fisso'){
    priceHtml = '<div class="price-big"><div class="da">a partire da</div><div class="v">€ '+q.mese+'</div><div class="u">al mese · ('+eur(q.anno)+'/anno)</div></div>';
  } else if (q.tipo==='salute'){
    const v = SAL[SS.tipo][SS.liv][SS.comp];
    priceHtml =
      '<div class="qrow"><select onchange="SS.tipo=this.value;upd()"><option value="attiva"'+(SS.tipo==='attiva'?' selected':'')+'>Attiva</option><option value="protezione"'+(SS.tipo==='protezione'?' selected':'')+'>Protezione</option></select>'
      + '<select onchange="SS.liv=this.value;upd()"><option value="base"'+(SS.liv==='base'?' selected':'')+'>Base</option><option value="plus"'+(SS.liv==='plus'?' selected':'')+'>Plus</option><option value="plat"'+(SS.liv==='plat'?' selected':'')+'>Platinum</option></select></div>'
      + '<div class="seg"><button class="'+(SS.comp==='s'?'on':'')+'" onclick="SS.comp=\'s\';upd()">Singolo</button><button class="'+(SS.comp==='n'?'on':'')+'" onclick="SS.comp=\'n\';upd()">Nucleo</button></div>'
      + '<div class="price-big" style="margin-top:12px"><div class="da">il tuo preventivo</div><div class="v">'+eur(v)+'</div><div class="u">all\'anno · ('+eur(Math.round(v/12))+'/mese)</div></div>';
  } else if (q.tipo==='aglea'){
    const linea = q.linea, v = SAL[linea][SS.liv][SS.comp];
    priceHtml =
      '<div class="qrow"><select onchange="SS.liv=this.value;upd()"><option value="base"'+(SS.liv==='base'?' selected':'')+'>Base</option><option value="plus"'+(SS.liv==='plus'?' selected':'')+'>Plus</option><option value="plat"'+(SS.liv==='plat'?' selected':'')+'>Platinum</option></select></div>'
      + '<div class="seg"><button class="'+(SS.comp==='s'?'on':'')+'" onclick="SS.comp=\'s\';upd()">Singolo</button><button class="'+(SS.comp==='n'?'on':'')+'" onclick="SS.comp=\'n\';upd()">Nucleo</button></div>'
      + '<div class="price-big" style="margin-top:12px"><div class="da">il tuo preventivo</div><div class="v">'+eur(v)+'</div><div class="u">all\'anno · ('+eur(Math.round(v/12))+'/mese)</div></div>';
  } else if (q.tipo==='opzioni'){
    const o = q.opzioni[QS.opt] || q.opzioni[0];
    const tot = o.p + (q.addon && QS.addon ? q.addon.p : 0);

function isQuotabile(){ const t=(P.quote||{}).tipo; return !!t && t!=='lead'; }
function currentParams(){ return { liv:SS.liv, comp:SS.comp, tipo:SS.tipo, opt:QS.opt, addon:QS.addon }; }

async function payConfig(){ if(!PAYCFG.loaded){ const c=await fetch(API+'/pay/config').then(r=>r.json()).catch(()=>({})); Object.assign(PAYCFG,c,{loaded:true}); } return PAYCFG; }
// Helper robusto: POST JSON con messaggi d'errore leggibili (rete, 404, 502 cold-start, errori server)
async function apiPost(path, body){
  let resp;
  try{
    resp = await fetch(API+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
  }catch(netErr){
    throw new Error('Connessione al server non riuscita. Il server potrebbe essersi appena avviato: attendi ~1 minuto e riprova.');
  }
  const txt = await resp.text();
  let data; try{ data = JSON.parse(txt); }catch(_){ throw new Error('Risposta non valida dal server (HTTP '+resp.status+'). '+String(txt).slice(0,140)); }
  if(!resp.ok || data.ok===false || data.error){ throw new Error(data.error || ('Errore del server (HTTP '+resp.status+')')); }
  return data;
}

var COMUNI=null, comuniLoading=null, comuneTimer=null;
function ensureComuni(){
  if(COMUNI) return Promise.resolve(COMUNI);
  if(!comuniLoading) comuniLoading=fetch('https://cdn.jsdelivr.net/gh/matteocontrini/comuni-json@master/comuni.json')
    .then(r=>r.json()).then(d=>{ COMUNI=d; return d; }).catch(()=>{ COMUNI=[]; return []; });
  return comuniLoading;
}
function ckComuneSearch(q){
  const box=document.getElementById('ck-com-res'); clearTimeout(comuneTimer);
  if(!q||q.trim().length<2){ if(box){ box.classList.remove('show'); box.innerHTML=''; } return; }
  comuneTimer=setTimeout(async()=>{
    const list=await ensureComuni(); const ql=q.trim().toLowerCase();
    const res=list.filter(c=>c.nome.toLowerCase().startsWith(ql)).slice(0,8); window.__CKCOM=res;
    if(!box) return;
    box.innerHTML=res.length?res.map((c,i)=>'<div class="geo-item" onclick="ckComuneApply('+i+')"><b>'+esc(c.nome)+'</b> ('+esc(c.sigla)+')</div>').join(''):'<div class="geo-item" style="color:var(--muted)">Nessun comune trovato</div>';
    box.classList.add('show');
  },250);
}
function ckComuneApply(i){
  const c=(window.__CKCOM||[])[i]; if(!c) return;
  const set=(id,v)=>{ const e=document.getElementById(id); if(e&&v!=null) e.value=v; };
  set('ck-comune', c.nome); set('ck-prov', c.sigla);
  const cap=Array.isArray(c.cap)?c.cap[0]:(c.cap||''); if(cap) set('ck-cap', cap);

    +'<label class="consent"><input type="checkbox" id="ck-pc-mkt"> (Facoltativo) Acconsento all\'invio di comunicazioni commerciali.</label>'
    +'<label style="font-size:13px;font-weight:700;margin-top:12px;display:block">Codice di firma (OTP)</label>'
    +'<input id="ck-pc-otp" inputmode="numeric" maxlength="6" placeholder="______" style="letter-spacing:6px;text-align:center;font-size:20px;font-weight:800">'
    +'<button class="btn" id="ck-pc-go" onclick="ckPrecVerify()"><i class="ti ti-writing-sign"></i> Firma e attiva la polizza</button>'
    +'<div style="text-align:center"><button style="background:none;border:none;color:var(--c1);font-weight:700;cursor:pointer;margin-top:10px;text-decoration:underline" onclick="ckPrecResend()">Non hai ricevuto il codice? Invialo di nuovo</button></div>'
    +'<div class="msg err" id="ck-pc-err"></div>';
}
async function ckPrecVerify(){
  const err=document.getElementById('ck-pc-err');
  if(!document.getElementById('ck-pc-prec').checked){ err.className='msg err'; err.textContent='Devi accettare la documentazione precontrattuale.'; return; }
  const otp=(document.getElementById('ck-pc-otp').value||'').trim();
  if(otp.length<6){ err.className='msg err'; err.textContent='Inserisci il codice OTP di 6 cifre.'; return; }
  const btn=document.getElementById('ck-pc-go'); btn.disabled=true; err.className='msg'; err.textContent='Firma in corso…';
  const consensi={ privacy:true, precontrattuale:true, marketing:document.getElementById('ck-pc-mkt').checked };
  try{
    const r=await fetch(API+'/sign/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:CK.preventivoId,t:CK.firmaToken,otp,consensi})}).then(x=>x.json());
    if(!r.ok) throw new Error(r.error||'Firma non riuscita.');
    ckDone();
  }catch(e){ btn.disabled=false; err.className='msg err'; err.textContent=e.message||'Errore, riprova.'; }
}
async function ckPrecResend(){
  const err=document.getElementById('ck-pc-err'); err.className='msg'; err.textContent='Reinvio in corso…';
  try{
    const r=await fetch(API+'/sign/resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:CK.preventivoId,t:CK.firmaToken})}).then(x=>x.json());
    if(!r.ok) throw new Error(r.error||'Reinvio non riuscito.');
    err.className='msg ok'; err.style.cssText='display:block;background:#e8f7ee;color:#1e7d46'; err.textContent='Nuovo codice inviato. Controlla la tua email.';
  }catch(e){ err.className='msg err'; err.textContent=e.message||'Errore.'; }
}
function ckDone(){ document.getElementById('ck-body').innerHTML='<div class="done"><div class="ic2">✓</div><div style="font-weight:800;font-size:18px;margin-bottom:6px">Polizza attivata!</div><div style="color:#6b7488">Grazie '+(CK.cliente?CK.cliente.nome:'')+'. Hai firmato privacy e documentazione precontrattuale e completato il pagamento. Riceverai via email la copia firmata e la conferma. La tua pratica è già registrata.</div></div>'; }
</script>
