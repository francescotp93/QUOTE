<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preventivo assicurazione — With Us</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{ --blue:#3b5bfd; --blue2:#2a45e0; --ink:#141a2e; --muted:#6b7488; --line:#e6e9f2; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f5f7fc;}
  .hero{background:linear-gradient(135deg,var(--c1,#3b5bfd),var(--c2,#2a45e0));color:#fff;padding:34px 22px 30px;}
  .hero .in{max-width:980px;margin:0 auto;display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
  .hero .ic{width:70px;height:70px;border-radius:18px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:38px;flex-shrink:0;}
  .hero h1{margin:0;font-size:30px;font-weight:900;line-height:1.1;}
  .hero p.claim{margin:8px 0 0;font-size:16px;opacity:.95;max-width:560px;}
  .price{margin-top:14px;display:inline-flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.16);padding:10px 16px;border-radius:14px;}
  .price .da{font-size:12px;opacity:.85;text-transform:uppercase;letter-spacing:1px;}
  .price .v{font-size:26px;font-weight:900;} .price .u{font-size:13px;opacity:.9;}
  .wrap{max-width:980px;margin:0 auto;padding:24px 22px 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;}}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(20,30,60,.06);}
  .benef{list-style:none;padding:0;margin:0;}
  .benef li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;}
  .benef li:last-child{border-bottom:none;}
  .benef i{color:#1c8a52;font-size:20px;flex-shrink:0;}
  .form h2{margin:0 0 4px;font-size:19px;}
  .form p.sub{margin:0 0 12px;color:var(--muted);font-size:13.5px;}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px;}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,91,253,.12);}
  textarea{min-height:64px;resize:vertical;}
  .hp{position:absolute;left:-9999px;}
  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.5;}
  .consent input{width:18px;height:18px;margin-top:2px;flex-shrink:0;}
  .btn{width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:16px;font-weight:800;cursor:pointer;}
  .btn:disabled{opacity:.6}
  .msg{margin-top:10px;font-size:13px;text-align:center}.err{color:#c0392b}
  .done{text-align:center;padding:24px 6px}.done .ic2{width:66px;height:66px;border-radius:50%;background:#e7f8ee;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:36px;color:#1c8a52}
  .foot{text-align:center;color:#9aa2b5;font-size:12px;padding:0 22px 28px}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="in">
    <div class="ic"><i class="ti" id="h-ic"></i></div>
    <div>
      <h1 id="h-title">Assicurazione</h1>
      <p class="claim" id="h-claim"></p>
      <div class="price" id="h-price" style="display:none"><span class="da">a partire da</span><span class="v" id="h-price-v"></span><span class="u" id="h-price-u"></span></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h2 style="margin:0 0 12px;font-size:18px">Cosa include</h2>
    <ul class="benef" id="benef"></ul>
    <p style="color:var(--muted);font-size:12.5px;margin-top:14px" id="note"></p>
  </div>

  <div class="card form" id="form-area">
    <h2 id="f-title">Richiedi il tuo preventivo</h2>
    <p class="sub">Compila e ti ricontattiamo noi, senza impegno.</p>
    <form id="lead-form">
      <input class="hp" id="azienda_web" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>Nome e cognome *</label><input id="nome" required placeholder="Mario Rossi">
      <label>Telefono</label><input id="telefono" type="tel" inputmode="tel" placeholder="333 1234567">
      <label>Email</label><input id="email" type="email" inputmode="email" placeholder="mario.rossi@email.it">
      <label>Messaggio (facoltativo)</label><textarea id="messaggio" placeholder="Le tue esigenze…"></textarea>
      <label class="consent"><input type="checkbox" id="privacy" required> Acconsento al trattamento dei dati per essere ricontattato (Reg. UE 2016/679).</label>
      <button class="btn" id="submit" type="submit">Richiedi preventivo</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>
<div class="foot">With Us Società Cooperativa · Via Cofano 76, 91100 Trapani · RUI A000747484</div>

<script>
const API = 'https://withus-backend-o0ux.onrender.com';
// Configurazione prodotti: prezzoDa è INDICATIVO (modificabile). null = "su misura".
const PRODOTTI = {
  vita:      { nome:'RC Vita Privata', ic:'ti-shield-heart', c1:'#3b5bfd', c2:'#2a45e0', claim:'Ti protegge dai danni che puoi causare a terzi nella vita di tutti i giorni.', da:12, unit:'€/mese', benef:['Massimali fino a € 1.000.000','Copertura tutta la famiglia','Attiva da subito, emissione immediata','Premio fisso e trasparente'] },
  salute:    { nome:'Salute', ic:'ti-heartbeat', c1:'#1c8a52', c2:'#0f6b3c', claim:'Rimborso spese mediche, ricoveri, visite e prevenzione con Aglea Salus.', da:75, unit:'€/mese', benef:['Ricovero e grande intervento','Visite, diagnostica e prevenzione','Formule Single e Nucleo familiare','Long Term Care opzionale'] },
  infortuni: { nome:'Infortuni', ic:'ti-bandage', c1:'#e8590c', c2:'#c44307', claim:'Un sostegno economico in caso di infortunio, a te e alla tua famiglia.', da:null, unit:'', benef:['Indennizzo per invalidità','Diaria da ricovero','Copertura 24 ore su 24','Capitale caso morte'] },
  tutela:    { nome:'Tutela Legale', ic:'ti-gavel', c1:'#5b3fb5', c2:'#3f2a86', claim:'Paghiamo noi avvocato e spese legali quando devi difendere i tuoi diritti.', da:null, unit:'', benef:['Spese legali e peritali','Assistenza in caso di controversie','Ambito circolazione, famiglia, lavoro','Consulenza legale telefonica'] },
  viaggio:   { nome:'Viaggio', ic:'ti-plane', c1:'#0c8599', c2:'#096477', claim:'Assistenza, spese mediche e bagaglio per i tuoi viaggi, in Italia e all\'estero.', da:null, unit:'', benef:['Spese mediche all\'estero','Assistenza 24h e rimpatrio','Bagaglio e ritardi','Annullamento viaggio'] },
  animali:   { nome:'Animali domestici', ic:'ti-paw', c1:'#c2255c', c2:'#9c1c49', claim:'Cure veterinarie e responsabilità civile per cani e gatti con Dottorpet.', da:null, unit:'', benef:['Rimborso spese veterinarie','RC per danni a terzi','Interventi e ricoveri','Assistenza dedicata'] },
  rcprof:    { nome:'RC Professionale', ic:'ti-briefcase', c1:'#1864ab', c2:'#0f4880', claim:'La copertura obbligatoria e su misura per la tua professione.', da:null, unit:'', benef:['Massimali su misura','Retroattività e postuma','Tariffe per ogni categoria','Emissione rapida'] },
  casa:      { nome:'Casa', ic:'ti-home', c1:'#2b8a3e', c2:'#1f6b2e', claim:'Proteggi la tua abitazione da incendio, furto e danni.', da:null, unit:'', benef:['Incendio e eventi naturali','Furto e rapina','RC del capofamiglia','Assistenza casa 24h'] },
  auto:      { nome:'Auto / Moto', ic:'ti-car', c1:'#212529', c2:'#0b0c0e', claim:'RC Auto e garanzie accessorie al miglior prezzo per il tuo veicolo.', da:null, unit:'', benef:['RC obbligatoria','Furto, incendio, kasko','Assistenza stradale','Tutela legale circolazione'] },
};

const params = new URLSearchParams(location.search);
const key = (params.get('prodotto') || 'vita').toLowerCase();
const fonte = params.get('fonte') || (document.referrer || 'landing');
const P = PRODOTTI[key] || PRODOTTI.vita;

document.documentElement.style.setProperty('--c1', P.c1);
document.documentElement.style.setProperty('--c2', P.c2);
document.getElementById('hero').style.setProperty('--c1', P.c1);
document.getElementById('hero').style.setProperty('--c2', P.c2);
document.getElementById('h-ic').classList.add(P.ic);
document.getElementById('h-title').textContent = 'Assicurazione ' + P.nome;
document.getElementById('h-claim').textContent = P.claim;
document.getElementById('f-title').textContent = 'Richiedi il preventivo · ' + P.nome;
document.title = 'Preventivo ' + P.nome + ' — With Us';
if (P.da != null) {
  document.getElementById('h-price').style.display = 'inline-flex';
  document.getElementById('h-price-v').textContent = '€ ' + P.da;
  document.getElementById('h-price-u').textContent = P.unit;
}
document.getElementById('benef').innerHTML = (P.benef||[]).map(b=>'<li><i class="ti ti-circle-check"></i> '+b+'</li>').join('');
document.getElementById('note').textContent = P.da!=null ? 'Prezzo indicativo "a partire da". Il preventivo esatto dipende dai tuoi dati.' : 'Prezzo su misura in base alle tue esigenze.';

document.getElementById('lead-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const msg=document.getElementById('msg'), btn=document.getElementById('submit');
  const nome=document.getElementById('nome').value.trim();
  const email=document.getElementById('email').value.trim();
  const telefono=document.getElementById('telefono').value.trim();
  if(!nome||(!email&&!telefono)){ msg.className='msg err'; msg.textContent='Inserisci nome e almeno un contatto.'; return; }
  btn.disabled=true; msg.className='msg'; msg.textContent='Invio…';
  try{
    const r=await fetch(API+'/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      nome:nome,email:email,telefono:telefono,prodotto:P.nome,
      messaggio:document.getElementById('messaggio').value.trim(),fonte:'landing · '+fonte,
      azienda_web:document.getElementById('azienda_web').value
    })});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||'Invio non riuscito');
    document.getElementById('form-area').innerHTML='<div class="done"><div class="ic2">✓</div><div style="font-weight:800;font-size:18px;margin-bottom:6px">Richiesta inviata!</div><div style="color:#6b7488">Grazie '+nome.split(' ')[0]+', ti ricontattiamo al più presto.</div></div>';
  }catch(err){ btn.disabled=false; msg.className='msg err'; msg.textContent=err.message||'Errore, riprova.'; }
});
</script>
</body>
</html>
