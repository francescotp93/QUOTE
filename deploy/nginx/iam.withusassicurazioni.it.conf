# ─────────────────────────────────────────────────────────────────────────────
# WITH US ONE — dominio unico su VPS (OVH)
#
# Un solo indirizzo, iam.withusassicurazioni.it, e un solo "portiere":
#   /                    → facciata IAM        (checkout /opt/withus-iam, branch main)
#   /nuovo-preventivo/   → facciata QUOTO      (checkout /opt/withus-quoto, branch main)
#   /api/*               → API preventivi      (funzione Vercel quote-ten-mu)
#   gli altri servizi    → backend locale      (withus-backend, porta 3000)
#
# Stessa origine = login condiviso, iframe leggibile, un software solo.
# È la traduzione fedele delle riscritture di vercel.json del repo IAM
# (la prova in ui-test.mjs controlla che i due elenchi restino identici).
#
# Questo file viene applicato DAL VPS STESSO tramite deploy/autopull.sh:
# copia in sites-available con .bak, `nginx -t`, reload — e rollback se il
# controllo fallisce. Il TLS lo aggiunge certbot (--nginx) al primo impianto.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name iam.withusassicurazioni.it;

    # ── Facciata IAM (radice) ────────────────────────────────────────────────
    root /opt/withus-iam;
    index index.html;

    # ── Facciata QUOTO sotto /nuovo-preventivo/ ──────────────────────────────
    location = /nuovo-preventivo { return 301 /nuovo-preventivo/; }
    location /nuovo-preventivo/ {
        alias /opt/withus-quoto/;
        index index.html;
        try_files $uri $uri/ /nuovo-preventivo/index.html;
    }

    # ── API preventivi (funzione Vercel) ─────────────────────────────────────
    location /api/ {
        proxy_pass https://quote-ten-mu.vercel.app;
        proxy_set_header Host quote-ten-mu.vercel.app;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Servizi del backend locale (withus-backend :3000) ────────────────────
    # Stesso elenco di vercel.json (IAM): un percorso dimenticato = 404 su IAM.
    location ~ ^/(auth|backup|catalogo|crm|diag|firma-collab|fonti|health|l|lead|login|mail|moto|notify|pay|preventivi|products|public|scrape|shop|sign|user)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Tutto il resto: file di IAM ──────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Le stesse intestazioni di sicurezza di vercel.json ───────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
}
