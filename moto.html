<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comparatore Moto — With Us</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root{ --blue:#3b5bfd; --blue2:#2a45e0; --ink:#141a2e; --muted:#6b7488; --line:#e6e9f2; --grn:#1c8a52; --grn2:#0f6b3c; }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f4f7fb;}
  a{color:var(--blue);text-decoration:none}
  .top{background:linear-gradient(135deg,#0b1437,#1b2a6b);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
  .top img{height:30px}
  .top b{font-size:16px;font-weight:800;letter-spacing:.3px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px rgba(10,20,40,.05)}
  h2{margin:0 0 14px;font-size:18px}
  label{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin:12px 0 5px}
  input[type=text],input[type=date]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;text-transform:uppercase}
  input[type=date]{text-transform:none}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:620px){.row{grid-template-columns:1fr}}
  .incl{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px}
  .badge{display:inline-flex;align-items:center;gap:5px;background:#e7f8ee;color:var(--grn2);border:1px solid #bfe8cf;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:700}
  .opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .opt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;cursor:pointer;user-select:none}
  .opt input{width:17px;height:17px}
  .slidewrap{display:flex;align-items:center;gap:12px}
  .slidewrap input[type=range]{flex:1}
  .seval{font-weight:800;color:var(--grn2);min-width:64px;text-align:right;font-size:16px}
  .btn{margin-top:18px;width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--grn),var(--grn2));color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  .btn:disabled{opacity:.6;cursor:default}
  .msg{margin-top:12px;font-size:13.5px}
  .err{color:#c0392b}
  .warn{background:#fff7e6;border:1px solid #ffe0a3;color:#8a5a00;border-radius:10px;padding:12px 14px;font-size:14px}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(28,138,82,.3);border-top-color:var(--grn);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .res{display:grid;grid-template-columns:1fr;gap:14px}
  .qcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
  .qhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:linear-gradient(135deg,#0b1437,#1b2a6b);color:#fff}
  .qhead .cn{font-size:16px;font-weight:800}
  .qprice{font-size:30px;font-weight:900}
  .qprice small{font-size:13px;font-weight:600;opacity:.8}
  .qbody{padding:14px 18px}
  .qrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .gar{background:#eef2ff;color:var(--blue2);border:1px solid #d6deff;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600}
  .wr{background:#fff0e6;color:#c25a00;border:1px solid #ffd1ad;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
  .veh{font-size:13px;color:var(--muted);margin-bottom:8px}
  .foot{text-align:center;color:#9aa2b5;font-size:12px;padding:6px 0 26px}
</style>
</head>
<body>
<div class="top">
  <img src="withus-logo-white.png" alt="With Us" onerror="this.style.display='none'">
  <b>Comparatore Moto</b>
</div>

<div class="wrap">
  <div id="authbox"></div>

  <div class="card" id="formcard" style="display:none">
    <h2><i class="ti ti-motorbike"></i> Nuovo preventivo moto</h2>
    <form id="f">
      <div class="row">
        <div><label>Targa veicolo *</label><input id="targa" required placeholder="AB12345" autocomplete="off"></div>
        <div><label>Data di nascita proprietario *</label><input id="dob" type="date" required></div>
      </div>

      <label>Ricarico / guadagno (Servizio supporto assicurativo)</label>
      <div class="slidewrap">
        <input id="se" type="range" min="10" max="150" step="1" value="20" oninput="document.getElementById('sev').textContent='€ '+this.value">
        <span class="seval" id="sev">€ 20</span>
      </div>

      <label>Sempre incluse</label>
      <div class="incl">
        <span class="badge"><i class="ti ti-shield-check"></i> Rinuncia alla rivalsa</span>
        <span class="badge"><i class="ti ti-gavel"></i> Tutela legale</span>
      </div>

      <label>Garanzie accessorie (opzionali)</label>
      <div class="opts">
        <label class="opt"><input type="checkbox" name="gar" value="furto"> Furto e Incendio</label>
        <label class="opt"><input type="checkbox" name="gar" value="infortuni"> Infortuni conducente</label>
        <label class="opt"><input type="checkbox" name="gar" value="assistenza"> Assistenza stradale</label>
        <label class="opt"><input type="checkbox" name="gar" value="monopattino"> Estensione monopattino</label>
      </div>

      <button class="btn" id="go" type="submit">Confronta preventivi</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

  <div class="res" id="risultati"></div>
</div>

<div class="foot">With Us Società Cooperativa · strumento riservato agli intermediari</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://ekjxrnsfqxnfxzrthdcf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVranhybnNmcXhuZnh6cnRoZGNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk0MzU4NjcsImV4cCI6MjA5NTAxMTg2N30.2OF2COAcLgM22xbmtqLWXgaDcVLtNh3AuX5MQ4_L02I';
const API = 'https://api.withusassicurazioni.it';
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
async function token(){ try{ const {data}=await db.auth.getSession(); return data?.session?.access_token || null; }catch(e){ return null; } }

// controllo login
(async () => {
  const t = await token();
  if (t) { $('formcard').style.display = 'block'; $('authbox').innerHTML = ''; }
  else $('authbox').innerHTML = '<div class="card"><div class="warn">Devi essere connesso a QUOTO per usare il comparatore. <a href="/">Vai al login →</a></div></div>';
})();

function dobToIt(v){ // YYYY-MM-DD -> DD/MM/YYYY
  if (!v) return '';
  const [a,m,g] = v.split('-');
  return g && m && a ? `${g}/${m}/${a}` : v;
}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const tok = await token();
  if (!tok) { $('msg').innerHTML = '<span class="err">Sessione scaduta: rientra da QUOTO.</span>'; return; }
  const targa = $('targa').value.trim().toUpperCase();
  const nascita = dobToIt($('dob').value);
  const se = $('se').value;
  const garanzie = [...document.querySelectorAll('input[name=gar]:checked')].map(x => x.value);

  $('go').disabled = true;
  $('msg').innerHTML = '<span class="spin"></span> Sto interrogando le compagnie… (può richiedere fino a 1 minuto)';
  $('risultati').innerHTML = '';
  try {
    const r = await fetch(API + '/moto/preventivo', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
      body: JSON.stringify({ targa, nascita, se, garanzie }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('Errore ' + r.status));
    render(d);
    $('msg').innerHTML = '';
  } catch (err) {
    $('msg').innerHTML = '<span class="err">' + esc(err.message || 'Errore') + '</span>';
  } finally {
    $('go').disabled = false;
  }
});

function render(d){
  const lista = (d.risultati || []).slice().sort((a,b) => num(a.premio_totale) - num(b.premio_totale));
  if (!lista.length) { $('risultati').innerHTML = '<div class="card">Nessun preventivo disponibile.</div>'; return; }
  $('risultati').innerHTML = lista.map(q => `
    <div class="qcard">
      <div class="qhead">
        <div class="cn">${esc(q.compagnia)}</div>
        <div class="qprice">€ ${esc(q.premio_totale || '—')} <small>/ anno</small></div>
      </div>
      <div class="qbody">
        ${q.veicolo ? `<div class="veh"><i class="ti ti-motorbike"></i> ${esc(q.veicolo)}</div>` : ''}
        <div class="qrow">
          <span class="gar">Rinuncia rivalsa</span>
          <span class="gar">Tutela legale</span>
          ${(q.garanzie_incluse || []).map(g => `<span class="gar">${esc(g)}</span>`).join('')}
          ${q.werepair ? '<span class="wr"><i class="ti ti-tools"></i> WeRepair · carrozzeria convenzionata</span>' : ''}
        </div>
      </div>
    </div>`).join('');
}
function num(s){ return parseFloat(String(s||'0').replace(/\./g,'').replace(',', '.')) || 0; }
</script>
</body>
</html>
